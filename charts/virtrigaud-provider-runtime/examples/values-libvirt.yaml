# Example values for libvirt provider  
image:
  repository: ghcr.io/projectbeskar/virtrigaud/provider-libvirt
  tag: "v0.2.0"

env:
  - name: LOG_LEVEL
    value: "info"
  - name: LIBVIRT_URI
    value: "qemu:///system"
  # Caps concurrent virsh/ssh subprocess forks so a reconcile burst can't exhaust
  # the libvirt host's fork limit ("cannot fork child process"). Default 4 (#288).
  # - name: VIRTRIGAUD_LIBVIRT_MAX_CONCURRENT_VIRSH
  #   value: "4"
  # Separate cap for long-lived disk-stream forks: S3 import/export SSH relays
  # and the scp disk copy. Kept independent of VIRTRIGAUD_LIBVIRT_MAX_CONCURRENT_VIRSH
  # so a multi-minute transfer can't starve short control/inventory virsh calls
  # (or be starved by them). Default 2 (ADR-0008 PR 1).
  # - name: VIRTRIGAUD_LIBVIRT_MAX_CONCURRENT_STREAM
  #   value: "2"

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

# Security context for libvirt.
#
# Hardened to match internal/controller/provider_controller.go's default
# SecurityContext for the qemu+ssh:// model (ADR-0008 PR 3 review, #306):
# non-root, read-only root filesystem, no privilege escalation, all Linux
# capabilities dropped. The libvirt provider reaches its hypervisor host over
# SSH (an in-process golang.org/x/crypto/ssh client as of ADR-0008 PR 3) —
# it does not need SYS_ADMIN or a writable root filesystem to do that; the
# SSH key comes from the mounted credentials Secret and is held in memory
# only, never written to disk.
#
# NOTE: this example ALSO hostPath-mounts /var/run/libvirt and
# /var/lib/libvirt below, which implies a provider pod co-located on the
# libvirt host talking to the LOCAL socket — a different topology than the
# qemu+ssh:// remote-host model these hardened defaults were designed for.
# If you use the co-located/local-socket model, confirm UID 65532 can access
# the host's libvirt-sock (typically root:libvirt, 0660) before relying on
# runAsNonRoot here; the qemu+ssh:// model has no such constraint since it
# never touches a local socket.
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532

# RBAC permissions for libvirt provider
rbac:
  rules:
    - apiGroups: [""]
      resources: ["configmaps", "secrets", "events"]
      verbs: ["get", "list", "watch", "create", "patch"]
    - apiGroups: [""]
      resources: ["nodes"]
      verbs: ["get", "list", "watch"]

# Volume mounts for libvirt socket and storage
volumeMounts:
  - name: libvirt-socket
    mountPath: /var/run/libvirt
  - name: libvirt-storage
    mountPath: /var/lib/libvirt
  # readOnlyRootFilesystem above makes /tmp itself read-only unless it is
  # backed by its own writable volume, so mount one here — this chart's
  # deployment.yaml has no default /tmp emptyDir of its own (unlike the
  # manager-controller-created Provider pod path, which already carries one).
  # Disk-backed (not tmpfs/memory): nothing in the libvirt provider pod writes
  # multi-GB disk data to local /tmp after ADR-0008 PR 3 (S3/NFS migration
  # staging happens on the remote host over SSH, not in this pod), but a
  # plain writable /tmp is kept as a safety net for anything that still
  # expects one (e.g. the local, non-ssh:// qemu:///system connection
  # fallback, if ever used, execs virsh locally).
  - name: tmp
    mountPath: /tmp

volumes:
  - name: tmp
    emptyDir: {}
  - name: libvirt-socket
    hostPath:
      path: /var/run/libvirt
      type: Directory
  - name: libvirt-storage
    hostPath:
      path: /var/lib/libvirt
      type: Directory

# Node selector to run on nodes with libvirt
nodeSelector:
  node-role.kubernetes.io/worker: "true"

# Tolerations for running on dedicated nodes
tolerations:
  - key: "hypervisor"
    operator: "Equal"
    value: "libvirt"
    effect: "NoSchedule"

# Network policy for libvirt environment
networkPolicy:
  enabled: true
  ingress:
    fromNamespaces:
      - virtrigaud-system
  egress:
    # Allow communication to libvirt daemons on nodes
    - to: []
      ports:
        - protocol: TCP
          port: 16509
    # Allow DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53

# Disable pod disruption budget for now (single instance)
podDisruptionBudget:
  enabled: false
