{{/*
Dedicated, least-privilege ServiceAccounts for the chart-templated provider
Deployments (libvirt / vsphere / proxmox).

Each provider pod runs under its OWN ServiceAccount that has NO RoleBinding or
ClusterRoleBinding — provider pods are gRPC servers that never call the
Kubernetes API (credentials and TLS material reach them as mounted Secret
volumes, not API reads). Previously these Deployments borrowed the manager's
ServiceAccount, which holds cluster-wide `secrets: get;list;watch`; a compromised
provider pod could therefore read every Secret in the cluster. These SAs, paired
with `automountServiceAccountToken: false` on the pod specs, remove that reach.

Each block is gated on the same `.Values.providers.<name>.enabled` flag as its
Deployment, so an SA is only rendered when its provider Deployment is.
*/}}
{{- if .Values.providers.libvirt.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "virtrigaud.providerServiceAccountName" (dict "root" . "provider" "libvirt") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "virtrigaud.labels" . | nindent 4 }}
    app.kubernetes.io/component: provider-libvirt
automountServiceAccountToken: false
{{- end }}
{{- if .Values.providers.vsphere.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "virtrigaud.providerServiceAccountName" (dict "root" . "provider" "vsphere") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "virtrigaud.labels" . | nindent 4 }}
    app.kubernetes.io/component: provider-vsphere
automountServiceAccountToken: false
{{- end }}
{{- if .Values.providers.proxmox.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "virtrigaud.providerServiceAccountName" (dict "root" . "provider" "proxmox") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "virtrigaud.labels" . | nindent 4 }}
    app.kubernetes.io/component: provider-proxmox
automountServiceAccountToken: false
{{- end }}
