{{- /*
The manager's Secret grant with rbac.secrets.scope=namespaced: a Role and
RoleBinding per listed namespace, and no Secret rule in the manager's
ClusterRole (or its release-namespace Role). See docs/manager-secret-access.md.

  - Provider namespaces (rbac.secrets.providerNamespaces): get, list, watch
    (the Secret informer, --secret-cache-namespaces), create, update (the
    host-inventory and operation-intent Secrets) and delete (operation-intent
    Secrets only, enforced in code by type, label, name prefix and UID).
  - Workload namespaces (rbac.secrets.workloadNamespaces): get only (cloud-init
    and S3 credential Secrets, read live).

No resourceNames: the Secret names are chosen by users (TLS, credentials,
cloud-init, S3) or derived from object names (<provider>-hosts, vrtg-op-<op_id>).
*/ -}}
{{- if and .Values.rbac.create (eq (include "virtrigaud.secretsScope" .) "namespaced") }}
{{- range $ns := splitList "," (include "virtrigaud.secretProviderNamespaces" $) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "virtrigaud.fullname" $ }}-manager-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "virtrigaud.labels" $ | nindent 4 }}
    app.kubernetes.io/component: manager
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - update
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "virtrigaud.fullname" $ }}-manager-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "virtrigaud.labels" $ | nindent 4 }}
    app.kubernetes.io/component: manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "virtrigaud.fullname" $ }}-manager-secrets
subjects:
- kind: ServiceAccount
  name: {{ include "virtrigaud.serviceAccountName" $ }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
{{- range $ns := splitList "," (include "virtrigaud.secretWorkloadNamespaces" $) }}
{{- if $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "virtrigaud.fullname" $ }}-manager-secrets-read
  namespace: {{ $ns }}
  labels:
    {{- include "virtrigaud.labels" $ | nindent 4 }}
    app.kubernetes.io/component: manager
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "virtrigaud.fullname" $ }}-manager-secrets-read
  namespace: {{ $ns }}
  labels:
    {{- include "virtrigaud.labels" $ | nindent 4 }}
    app.kubernetes.io/component: manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "virtrigaud.fullname" $ }}-manager-secrets-read
subjects:
- kind: ServiceAccount
  name: {{ include "virtrigaud.serviceAccountName" $ }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
