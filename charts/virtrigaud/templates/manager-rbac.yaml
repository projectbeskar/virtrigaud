{{- if .Values.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "virtrigaud.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "virtrigaud.labels" . | nindent 4 }}
    app.kubernetes.io/component: manager
  {{- with .Values.manager.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- if eq .Values.rbac.scope "cluster" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "virtrigaud.clusterRoleName" . }}
  labels:
    {{- include "virtrigaud.labels" . | nindent 4 }}
    app.kubernetes.io/component: manager
rules:
# virtrigaud CRDs the manager actively manages (create + mutate + delete).
# Verb sets are least-privilege per issue #152: only the resources whose
# controllers actually write are granted write verbs. vmplacementpolicy
# remains reference-only (no standalone controller); vmclones and vmsets now
# have controllers and are granted their scoped verbs below (issue #179).
- apiGroups:
  - infra.virtrigaud.io
  resources:
  - virtualmachines
  - virtualmachines/status
  - virtualmachines/finalizers
  - providers
  - providers/status
  - providers/finalizers
  - vmsnapshots
  - vmsnapshots/status
  - vmsnapshots/finalizers
  - vmmigrations
  - vmmigrations/status
  - vmmigrations/finalizers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# VMClone has a controller (issue #179) that updates the VMClone and its
# status/finalizers but never creates or deletes VMClones (users do). It
# creates VirtualMachines — that write verb is granted in the block above.
- apiGroups:
  - infra.virtrigaud.io
  resources:
  - vmclones
  - vmclones/status
  - vmclones/finalizers
  verbs:
  - get
  - list
  - patch
  - update
  - watch
# VMSet has a not-yet-active stub controller (issue #179) that only reports a
# ControllerNotImplemented condition: read VMSets, write only their status.
- apiGroups:
  - infra.virtrigaud.io
  resources:
  - vmsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - infra.virtrigaud.io
  resources:
  - vmsets/status
  verbs:
  - get
  - patch
  - update
# VMClass is created/updated by the adoption controller but never deleted by
# the manager, so it omits the delete verb.
- apiGroups:
  - infra.virtrigaud.io
  resources:
  - vmclasses
  - vmclasses/status
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
# VMImage and VMNetworkAttachment are read-only inputs: the manager resolves
# them when building VMs but never creates or mutates them (issue #152).
# VMImage status is the exception: the VirtualMachine controller is the single
# writer of the image-prepare status (ProviderStatus/PrepareTaskRef/Phase/Ready/
# AvailableOn) during VM-create-driven preparation (issue #154), so vmimages/
# status gets scoped get;patch;update — but the VMImage object itself stays
# read-only.
- apiGroups:
  - infra.virtrigaud.io
  resources:
  - vmimages
  - vmnetworkattachments
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - infra.virtrigaud.io
  resources:
  - vmimages/status
  verbs:
  - get
  - patch
  - update
# Host and HostPool are the clustered-provider inventory (ADR-0007 P1). The
# provider_controller and host_controller READ them (get;list;watch): the
# provider_controller renders a clustered Provider's host set into its projected
# host-inventory Secret; the inventory-sync host_controller reconciles each Host
# by calling the provider's GetHostInfo. Neither writes the Host/HostPool spec
# (the admin authors them) — Host STATUS is written (see hosts/status below),
# and the host_controller's in-use finalizer is the one metadata write (below).
- apiGroups:
  - infra.virtrigaud.io
  resources:
  - hostpools
  verbs:
  - get
  - list
  - watch
# hosts: read, plus update for exactly one purpose — the host_controller adds
# and removes its in-use finalizer (host.infra.virtrigaud.io/in-use, ADR-0007
# Addendum A A1), so a Host cannot be deleted while any VirtualMachine is bound
# to it or has a create pending on it. The controller never changes a Host
# spec. hosts/finalizers is granted for clusters that enforce
# OwnerReferencesPermissionEnforcement.
- apiGroups:
  - infra.virtrigaud.io
  resources:
  - hosts
  verbs:
  - get
  - list
  - update
  - watch
- apiGroups:
  - infra.virtrigaud.io
  resources:
  - hosts/finalizers
  verbs:
  - update
# VMPlacementPolicy is the scheduler's input language (ADR-0007 P1 D4). The
# virtualmachine_controller READS it (get;list;watch) when scheduling a VM onto a
# clustered provider's HostPool; it never writes it (the admin authors the policy).
- apiGroups:
  - infra.virtrigaud.io
  resources:
  - vmplacementpolicies
  verbs:
  - get
  - list
  - watch
# hosts/status: the inventory-sync host_controller writes live capacity/health
# into Host.status (ADR-0007 P1 D3). Status subresource only — never the spec.
- apiGroups:
  - infra.virtrigaud.io
  resources:
  - hosts/status
  verbs:
  - get
  - patch
  - update
# Secrets: the manager READS provider credential and TLS Secrets (cloud-init /
# credential / TLS Secret resolution) and, for clustered providers (ADR-0007
# D3), CREATES/UPDATES the single host-inventory Secret it owns per Provider
# (<provider>-hosts) — the only Secret it writes. It never deletes Secrets: that
# Secret is owner-referenced to its Provider and reclaimed by garbage collection.
# RBAC cannot scope create to one name, so create;update is namespace/cluster-
# wide; only the trusted manager holds it (provider pods have NO secrets RBAC —
# see the dedicated per-provider ServiceAccount below).
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - get
  - list
  - update
  - watch
# Services for remote provider runtimes (provider_controller reconciles them).
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# ServiceAccounts: the provider_controller creates a dedicated, least-privilege
# ServiceAccount per provider (with NO RoleBinding/ClusterRoleBinding) so
# provider pods run under their own token-less identity instead of borrowing the
# manager's cluster-privileged SA. The manager must be able to create/manage
# that child SA. This grant is scoped to serviceaccounts only; it does NOT touch
# the manager's own ServiceAccount or the secrets access declared above.
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# Events: the manager only emits events (create/patch); it never lists/deletes.
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
# PersistentVolumeClaims for VM migration storage (vmmigration_controller).
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# Pods for VM migration provider readiness checks (vmmigration_controller
# lists provider pods to confirm the migration PVC is mounted). Read-only.
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
# Namespaces, read-only: the VMClone and VMMigration controllers read a
# cross-namespace target's Namespace for the
# infra.virtrigaud.io/allowed-source-namespaces grant, and every controller
# that resolves a Provider, VMClass or VMImage in another namespace matches its
# spec.consumerNamespaceSelector against the referencing Namespace's labels
# (both are watched so a grant or revocation takes effect promptly). The
# manager never writes Namespaces.
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
# Four CRDs, get only and only those objects: the manager checks at startup
# and on every readiness probe that the installed VirtualMachine CRD has
# status.boundProvider and the spec.providerRef immutability rule, and that the
# Provider, VMClass and VMImage CRDs have spec.consumerNamespaceSelector
# (readiness fails while one does not). Cluster scope only: a namespaced Role
# cannot grant a cluster-scoped resource, so with rbac.scope=namespace the check
# reports "unknown" and does not affect readiness.
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  resourceNames:
  - virtualmachines.infra.virtrigaud.io
  - providers.infra.virtrigaud.io
  - vmclasses.infra.virtrigaud.io
  - vmimages.infra.virtrigaud.io
  verbs:
  - get
# Deployment resources for remote providers (provider_controller reconciles
# them). deployments/status dropped — the manager reads deployment status off
# the object but never writes the status subresource.
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# Leader election
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - get
  - list
  - update
{{- with .Values.rbac.additionalRules }}
{{- toYaml . | nindent 0 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "virtrigaud.clusterRoleBindingName" . }}
  labels:
    {{- include "virtrigaud.labels" . | nindent 4 }}
    app.kubernetes.io/component: manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "virtrigaud.clusterRoleName" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "virtrigaud.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- else }}
