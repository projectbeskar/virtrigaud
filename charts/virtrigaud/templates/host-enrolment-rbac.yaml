{{- /*
Per-host agent enrolment RBAC. DEVELOPMENT ONLY: used only by a manager built
with the virtrigaud_dev build tag and started with the --dev-host-enrolment-*
flags (which this chart does not set). Off by default.

Grants exactly: approve on the named cert-manager signers (resourceNames, no
wildcard), create on subjectaccessreviews (the per-Host enrol check), get/list
on admission webhook configurations (the fail-closed cert-manager check), and,
in the enrolment namespace only, get/list/watch on certificaterequests, update
on certificaterequests/status, and the pins Secrets. Only the manager may write
Secrets in the enrolment namespace.

It renders only with experimental.hostEnrolment.developmentBuild=true, an
explicit statement that the manager image is a development build (a release
manager cannot use these grants).
*/ -}}
{{- $he := ((.Values.experimental | default dict).hostEnrolment | default dict) }}
{{- if and .Values.rbac.create $he.enabled }}
{{- if not $he.developmentBuild }}
{{- fail "experimental.hostEnrolment.enabled needs experimental.hostEnrolment.developmentBuild=true: per-host agent enrolment works only with a development build of the manager (built with the virtrigaud_dev tag); a release manager refuses its flags and must not hold a signer approve grant" }}
{{- end }}
{{- $ns := required "experimental.hostEnrolment.namespace is required when experimental.hostEnrolment.enabled is true" $he.namespace }}
{{- if not $he.signerNames }}
{{- fail "experimental.hostEnrolment.signerNames must list the host-agent signer name(s), e.g. issuers.cert-manager.io/<namespace>.<name>" }}
{{- end }}
{{- range $he.signerNames }}
{{- if or (contains "*" .) (not (contains "/" .)) }}
{{- fail (printf "experimental.hostEnrolment.signerNames: %q must be one exact signer name (<resource>.<group>/<namespace>.<name>), never a wildcard" .) }}
{{- end }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "virtrigaud.fullname" . }}-host-enrolment-approver
  labels:
    {{- include "virtrigaud.labels" . | nindent 4 }}
rules:
- apiGroups: ["cert-manager.io"]
  resources: ["signers"]
  verbs: ["approve"]
  resourceNames:
  {{- range $he.signerNames }}
  - {{ . | quote }}
  {{- end }}
- apiGroups: ["authorization.k8s.io"]
  resources: ["subjectaccessreviews"]
  verbs: ["create"]
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "virtrigaud.fullname" . }}-host-enrolment-approver
  labels:
    {{- include "virtrigaud.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "virtrigaud.fullname" . }}-host-enrolment-approver
subjects:
- kind: ServiceAccount
  name: {{ include "virtrigaud.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "virtrigaud.fullname" . }}-host-enrolment
  namespace: {{ $ns }}
  labels:
    {{- include "virtrigaud.labels" . | nindent 4 }}
rules:
- apiGroups: ["cert-manager.io"]
  resources: ["certificaterequests"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["cert-manager.io"]
  resources: ["certificaterequests/status"]
  verbs: ["update"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create", "delete", "get", "list", "update", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "virtrigaud.fullname" . }}-host-enrolment
  namespace: {{ $ns }}
  labels:
    {{- include "virtrigaud.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "virtrigaud.fullname" . }}-host-enrolment
subjects:
- kind: ServiceAccount
  name: {{ include "virtrigaud.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
