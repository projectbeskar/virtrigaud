{{- /*
Per-host agent enrolment RBAC. DEVELOPMENT ONLY: used only by a manager built
with the virtrigaud_dev build tag and started with the --dev-host-enrolment-*
flags (which this chart does not set). Off by default.

Grants exactly: approve on the named cert-manager signers (resourceNames, no
wildcard), create on subjectaccessreviews (the per-Host enrol check), get/list
on admission webhook configurations (the fail-closed cert-manager check), and,
in the enrolment namespace only, create/delete/get/list/watch on
certificaterequests (create and delete: the manager's own certificate renewal
requests; with approve this lets the manager obtain host-agent certificates by
itself, see config/rbac/host-enrolment/README.md), update on
certificaterequests/status, and the pins Secrets. Only the manager may write
Secrets in the enrolment namespace.

It renders only with experimental.hostEnrolment.developmentBuild=true, an
explicit statement that the manager image is a development build (a release
manager cannot use these grants).

It also renders only with rbac.secrets.scope=namespaced: with the cluster
scope the manager can read every Secret, including the host-agent
subordinate CA's key Secret (in cert-manager's cluster resource namespace for
the recommended ClusterIssuer), and could sign CA-valid host-agent
certificates with no approval at all. Neither the enrolment namespace nor the
namespace of the declared sub-CA key Secret
(experimental.hostEnrolment.caKeySecret) may be listed in
rbac.secrets.providerNamespaces or workloadNamespaces:

  - The sub-CA key namespace must give the manager no Secret access at all.
  - The enrolment namespace gets its Secret verbs from this file's Role only.
    A namespaced-grant Role there would add no verb, but listing it declares
    it a namespace of Provider objects (whose authors write Secrets there) or
    of workloads, and only the manager may write Secrets in the enrolment
    namespace.

The development manager checks the same at startup with
SelfSubjectAccessReviews (--dev-host-enrolment-ca-key-secret), so a manager
whose RBAC is not rendered by this chart is held to it too. Those reviews need
create on selfsubjectaccessreviews, which Kubernetes grants every
authenticated user through the default system:basic-user ClusterRole, so no
rule is added for them.
*/ -}}
{{- $he := ((.Values.experimental | default dict).hostEnrolment | default dict) }}
{{- if and .Values.rbac.create $he.enabled }}
{{- if not $he.developmentBuild }}
{{- fail "experimental.hostEnrolment.enabled needs experimental.hostEnrolment.developmentBuild=true: per-host agent enrolment works only with a development build of the manager (built with the virtrigaud_dev tag); a release manager refuses its flags and must not hold a signer approve grant" }}
{{- end }}
{{- $ns := required "experimental.hostEnrolment.namespace is required when experimental.hostEnrolment.enabled is true" $he.namespace }}
{{- if ne (include "virtrigaud.secretsScope" .) "namespaced" }}
{{- fail "experimental.hostEnrolment.enabled needs rbac.secrets.scope=namespaced: with the cluster scope the manager can read every Secret in the cluster, including the host-agent subordinate CA's key, and a compromised manager could then sign CA-valid host-agent certificates without any approval; the sub-CA key must not be readable by the manager (list the namespaces the manager needs in rbac.secrets.providerNamespaces and workloadNamespaces, see docs/manager-secret-access.md)" }}
{{- end }}
{{- $ns = include "virtrigaud.secretNamespaceList" (dict "value" (list $ns) "name" "experimental.hostEnrolment.namespace") }}
{{- $secretsValues := (dig "secrets" dict (.Values.rbac | default dict)) | default dict }}
{{- $providerNamespaces := splitList "," (include "virtrigaud.secretProviderNamespaces" .) }}
{{- $workloadNamespaces := splitList "," (include "virtrigaud.secretNamespaceList" (dict "value" $secretsValues.workloadNamespaces "name" "rbac.secrets.workloadNamespaces")) }}
{{- $granted := concat $providerNamespaces $workloadNamespaces }}
{{- if has $ns $granted }}
{{- fail (printf "experimental.hostEnrolment.namespace %q must not be listed in rbac.secrets.providerNamespaces or workloadNamespaces: only the manager may write Secrets in the enrolment namespace, and its Secret access there comes from the enrolment Role alone; keep Provider objects and workloads in other namespaces" $ns) }}
{{- end }}
{{- with $he.caKeySecret }}
{{- $parts := splitList "/" (toString .) }}
{{- if or (ne (len $parts) 2) (gt (len (index $parts 0)) 63) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" (index $parts 0))) (gt (len (index $parts 1)) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" (index $parts 1))) }}
{{- fail (printf "experimental.hostEnrolment.caKeySecret: %q must be <namespace>/<name> of the host-agent subordinate CA's key Secret" (toString .)) }}
{{- end }}
{{- $keyNS := index $parts 0 }}
{{- if eq $keyNS $ns }}
{{- fail (printf "experimental.hostEnrolment.caKeySecret: the sub-CA key Secret must not be in the enrolment namespace %q, where the manager can read and write Secrets; use a ClusterIssuer, whose key Secret lives in cert-manager's cluster resource namespace" $ns) }}
{{- end }}
{{- if has $keyNS $granted }}
{{- fail (printf "experimental.hostEnrolment.caKeySecret: namespace %q is listed in rbac.secrets.providerNamespaces or workloadNamespaces; the sub-CA key must not be readable by the manager, so grant it no Secret access in that namespace" $keyNS) }}
{{- end }}
{{- end }}
{{- if not $he.signerNames }}
{{- fail "experimental.hostEnrolment.signerNames must list the host-agent signer name(s), e.g. issuers.cert-manager.io/<namespace>.<name>" }}
{{- end }}
{{- range $he.signerNames }}
{{- if or (contains "*" .) (not (contains "/" .)) }}
{{- fail (printf "experimental.hostEnrolment.signerNames: %q must be one exact signer name (<resource>.<group>/<namespace>.<name>), never a wildcard" .) }}
{{- end }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "virtrigaud.fullname" . }}-host-enrolment-approver
  labels:
    {{- include "virtrigaud.labels" . | nindent 4 }}
rules:
- apiGroups: ["cert-manager.io"]
  resources: ["signers"]
  verbs: ["approve"]
  resourceNames:
  {{- range $he.signerNames }}
  - {{ . | quote }}
  {{- end }}
- apiGroups: ["authorization.k8s.io"]
  resources: ["subjectaccessreviews"]
  verbs: ["create"]
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "virtrigaud.fullname" . }}-host-enrolment-approver
  labels:
    {{- include "virtrigaud.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "virtrigaud.fullname" . }}-host-enrolment-approver
subjects:
- kind: ServiceAccount
  name: {{ include "virtrigaud.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "virtrigaud.fullname" . }}-host-enrolment
  namespace: {{ $ns }}
  labels:
    {{- include "virtrigaud.labels" . | nindent 4 }}
rules:
- apiGroups: ["cert-manager.io"]
  resources: ["certificaterequests"]
  verbs: ["create", "delete", "get", "list", "watch"]
- apiGroups: ["cert-manager.io"]
  resources: ["certificaterequests/status"]
  verbs: ["update"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create", "delete", "get", "list", "update", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "virtrigaud.fullname" . }}-host-enrolment
  namespace: {{ $ns }}
  labels:
    {{- include "virtrigaud.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "virtrigaud.fullname" . }}-host-enrolment
subjects:
- kind: ServiceAccount
  name: {{ include "virtrigaud.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
