# Default values for virtrigaud
# This is a YAML-formatted file.

# Global configuration
global:
  # Image registry for all images
  imageRegistry: ghcr.io
  # Image pull policy
  imagePullPolicy: IfNotPresent
  # Image pull secrets
  imagePullSecrets: []

# Manager configuration
manager:
  # Image configuration
  image:
    repository: projectbeskar/virtrigaud/manager
    tag: "v0.3.0"
    pullPolicy: IfNotPresent

  # Replica count for manager
  replicaCount: 1

  # Resource limits and requests
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  # Security context (secure defaults)
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  # Pod security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    fsGroupChangePolicy: "OnRootMismatch"
    seccompProfile:
      type: RuntimeDefault

  # Service account
  serviceAccount:
    create: true
    annotations: {}
    name: ""

  # Node selector
  nodeSelector: {}

  # Tolerations
  tolerations: []

  # Affinity
  affinity: {}

  # Environment variables
  env:
    - name: VIRTRIGAUD_LOG_LEVEL
      value: "info"
    - name: VIRTRIGAUD_LOG_FORMAT
      value: "json"
    - name: VIRTRIGAUD_TRACING_ENABLED
      value: "false"

  # Additional volumes
  volumes: []

  # Additional volume mounts
  volumeMounts: []

# Provider configuration
#
# These are OPTIONAL chart-templated standalone provider Deployments. They are
# DISABLED by default (#173): in normal operation providers are deployed by the
# manager's ProviderController from Provider CRs (spec.runtime), which wires the
# provider's TLS posture from the CR. Enable one here only if you are NOT using a
# Provider CR for it AND you have configured the providerTLS block below (set
# providerTLS.secretName, or providerTLS.insecure=true) — otherwise the provider
# fail-closes on startup per ADR-0003 (v0.3.7 secure-by-default) and crash-loops.
providers:
  # Libvirt provider
  libvirt:
    enabled: false
    replicaCount: 1
    image:
      repository: projectbeskar/virtrigaud/provider-libvirt
      tag: "v0.3.17-dev"
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 200m
        memory: 256Mi

  # vSphere provider  
  vsphere:
    enabled: false
    replicaCount: 1
    image:
      repository: projectbeskar/virtrigaud/provider-vsphere
      tag: "v0.3.0"
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 200m
        memory: 256Mi

  # Proxmox provider
  proxmox:
    enabled: false
    replicaCount: 1
    image:
      repository: projectbeskar/virtrigaud/provider-proxmox
      tag: "v0.3.0"
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 200m
        memory: 256Mi
    
    # ⚠️  REQUIRED: Proxmox VE server configuration
    # The Proxmox provider requires connection to an active Proxmox VE server.
    # Configure the environment variables below with your Proxmox server details.
    # 
    # For detailed setup instructions, see: docs/providers/proxmox.md
    #
    # Example configuration:
    # env:
    #   - name: PVE_ENDPOINT
    #     value: "https://your-proxmox-server.example.com:8006"
    #   - name: PVE_USERNAME
    #     value: "root@pam"  # or "user@realm"
    #   - name: PVE_PASSWORD
    #     value: "your-password"
    #   - name: PVE_TOKEN_ID      # Alternative to password authentication
    #     value: "user@realm!tokenid"
    #   - name: PVE_TOKEN_SECRET  # Use with PVE_TOKEN_ID
    #     value: "token-secret-value"
    #   - name: PVE_INSECURE_SKIP_VERIFY  # For self-signed certificates
    #     value: "true"
    env: []

# Provider mTLS configuration (ADR-0003, v0.3.7).
#
# This block governs the gRPC TLS posture of the chart-templated provider
# Deployments (libvirt / vsphere / proxmox). It does NOT affect providers
# deployed dynamically by the manager's ProviderController from Provider
# CRs — those read their TLS posture from the Provider CR's
# spec.runtime.service.tls block.
#
# Cert provisioning is the operator's responsibility (maintainer decision
# 2026-05-27): the chart references an externally-provisioned Secret, it
# does NOT mint certs. There is intentionally no cert-manager scaffolding
# here. See docs/operations/security.md (PR-4) for the openssl recipe and
# the Secret YAML template.
#
# Behaviour:
#   - secretName set  → the Secret (keys tls.crt/tls.key/ca.crt) is mounted
#     at /etc/virtrigaud/tls and the provider runs mTLS-mandatory.
#   - secretName empty + insecure=true → no mount; VIRTRIGAUD_PROVIDER_INSECURE
#     is set so the provider boots in audit-flagged plaintext mode.
#   - secretName empty + insecure=false → no TLS env wiring is rendered; the
#     provider's own ResolveTLSAndAuth hard-exits on start (secure-by-default).
providerTLS:
  # secretName is the name of an externally-provisioned Kubernetes Secret
  # (type kubernetes.io/tls) containing tls.crt, tls.key, and ca.crt. Empty
  # by default — operators opt in by setting it.
  secretName: ""

  # allowedSANs is a list of SAN/CN values the provider accepts from the
  # manager's client certificate. Maps to VIRTRIGAUD_PROVIDER_ALLOWED_SANS
  # (comma-joined). Empty (default) is permissive: any client cert signed by
  # the configured CA is accepted (ADR-0003 decision #5).
  allowedSANs: []

  # insecure is the explicit plaintext escape hatch. Maps to
  # VIRTRIGAUD_PROVIDER_INSECURE. Only honoured when secretName is empty.
  # false by default (secure-by-default).
  insecure: false

# RBAC configuration
rbac:
  # Enable RBAC
  create: true
  # Scope: namespace or cluster (cluster required for CRDs)
  scope: cluster
  # Additional rules
  additionalRules: []

# Security configuration
security:
  # Pod Security Profile: strict, baseline, or privileged
  podSecurityProfile: strict
  
  # Network policies
  networkPolicies:
    enabled: true
    # Ingress rules
    ingress:
      # Allow manager to provider communication
      managerToProvider: true
      # Allow external access to webhooks
      webhookIngress: true
    # Egress rules  
    egress:
      # Allow provider to hypervisor communication
      providerToHypervisor: true
      # Allow DNS resolution
      dns: true
      # Allow access to Kubernetes API
      kubernetesAPI: true

  # TLS/mTLS configuration
  tls:
    # Enable TLS for provider gRPC
    enabled: true
    # Enable mutual TLS
    mTLS: true
    # Certificate source: cert-manager, manual, or self-signed
    source: self-signed
    # Certificate secret names (when source is manual)
    secrets:
      manager: virtrigaud-manager-tls
      providers: virtrigaud-provider-tls
    # cert-manager configuration (when source is cert-manager)
    certManager:
      issuer: virtrigaud-ca-issuer
      issuerKind: ClusterIssuer

# Webhook configuration
#
# Master switch `enabled` is OFF by default. Turning it ON renders the webhook
# Service + the ValidatingWebhookConfiguration (and, if selected, the cert
# Secret) AND requires the manager to be started with webhook serving certs
# (see the `certificates` block below and the manager `--webhook-cert-path`
# wiring in manager-deployment.yaml). Without certs the manager does not register
# its webhooks, so leaving this on without a working cert source would make the
# rendered ValidatingWebhookConfiguration reject Provider writes under
# failurePolicy=Fail. Enable this only once a cert source is configured.
#
# The ONLY admission webhook backed by manager Go code today is the validating
# `vprovider.kb.io` webhook — the ADR-0007 D2 guard that rejects
# spec.topology=cluster on provider types with a native cluster manager (only
# libvirt is allow-listed). There are NO mutating or conversion webhooks backed by
# Go in this repo, so this chart renders ONLY the validating configuration (plus
# its Service and serving cert). For self-signed (the default) the chart keeps the
# generated caBundle coherent with the serving cert and persists it across upgrades.
#
# Production / banking / GitOps posture (security review): prefer
# `certificates.source: cert-manager`. The self-signed default persists its cert
# across upgrades via Helm `lookup`, which only works under `helm install/upgrade`
# with an identity that can read Secrets in this namespace. Under `helm template`
# render-then-apply (Argo CD, `helm template | kubectl apply`) `lookup` is always
# empty, so every sync regenerates the CA + serving cert + caBundle — churning the
# Secret and briefly reopening a failurePolicy=Fail admission gap while the manager
# reloads. cert-manager keeps caBundle↔cert coherence server-side (cainjector),
# independent of render idempotency, and never puts the private key in Helm release
# history. Also: with failurePolicy=Fail the manager is on the Provider-admission
# path, so run it HA when webhooks are enabled — `manager.replicaCount: 2` plus a
# PodDisruptionBudget and anti-affinity (the webhook server is not leader-gated, so
# all replicas serve it).
webhooks:
  # Enable admission webhooks (master switch — see the note above; requires certs)
  enabled: false

  # Validating webhook — vprovider.kb.io (ADR-0007 D2 topology x type guard).
  # This is the only admission webhook backed by manager Go code.
  validating:
    enabled: true
    failurePolicy: Fail

  # Certificate configuration for the webhook serving cert.
  certificates:
    # Certificate source:
    #   self-signed  — the chart generates a CA + serving cert and keeps the
    #                  caBundle coherent with it, reusing the existing Secret on
    #                  upgrade (via lookup) so the cert is not silently rotated.
    #                  Zero setup — best for dev/lab. Caveats: (1) persistence
    #                  needs `helm install/upgrade` with Secret-read RBAC (NOT
    #                  Argo CD / `helm template` — see the note above); (2) the
    #                  serving key is stored in Helm release history; (3) the
    #                  reuse-on-upgrade path keeps the OLD SANs, so if you change
    #                  nameOverride/fullnameOverride/secretName (or switch source)
    #                  on an existing release, delete the serving Secret first so a
    #                  fresh, correctly-SAN'd cert is generated.
    #   cert-manager — the chart renders a cert-manager Certificate (you install
    #                  cert-manager INCLUDING cainjector, and supply the
    #                  Issuer/ClusterIssuer named below); the caBundle is injected
    #                  via inject-ca-from. Recommended for production/GitOps. Prefer
    #                  a dedicated, webhook-only Issuer over a broad shared CA so the
    #                  injected trust is bounded to this one cert.
    #   manual       — you provision the serving Secret (secretName) yourself and
    #                  set caBundle below to the matching CA (base64-encoded PEM).
    source: self-signed
    # Serving-cert Secret name. Mounted into the manager pod; generated by the
    # chart for self-signed, and the Certificate's secretName for cert-manager.
    secretName: virtrigaud-webhook-certs
    # caBundle (base64-encoded CA PEM) — REQUIRED only for source: manual, so the
    # ValidatingWebhookConfiguration trusts your externally-provisioned serving
    # cert. Ignored for self-signed (derived) and cert-manager (injected).
    caBundle: ""
    # cert-manager configuration (used only when source: cert-manager). The chart
    # renders the Certificate; the Issuer/ClusterIssuer is deployment-specific and
    # must already exist — the chart does NOT create it.
    certManager:
      issuer: virtrigaud-ca-issuer
      issuerKind: ClusterIssuer

# Observability configuration
observability:
  # Prometheus monitoring
  prometheus:
    enabled: false
    # Create ServiceMonitor
    serviceMonitor:
      enabled: false
      interval: 30s
      scrapeTimeout: 10s
      labels: {}
      
    # Create PrometheusRule for alerts
    prometheusRule:
      enabled: false
      labels: {}
      
  # Grafana dashboards
  grafana:
    enabled: false
    # Create ConfigMaps with dashboards
    dashboards:
      enabled: false
      labels:
        grafana_dashboard: "1"
        
  # OpenTelemetry tracing
  tracing:
    enabled: false
    endpoint: ""
    samplingRatio: 0.1

# Autoscaling
autoscaling:
  # Manager autoscaling
  manager:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
    
  # Provider autoscaling  
  providers:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    # Custom metrics for provider scaling
    customMetrics:
      - type: Pods
        pods:
          metric:
            name: virtrigaud_provider_tasks_inflight
          target:
            type: AverageValue
            averageValue: "10"

# Configuration
config:
  # Feature gates
  featureGates: []
  
  # Worker configuration
  workers:
    perKind: 2
    maxInflightTasks: 100
    
  # Retry configuration
  retry:
    maxAttempts: 5
    baseDelay: 500ms
    maxDelay: 30s
    
  # Circuit breaker configuration
  circuitBreaker:
    failureThreshold: 10
    resetTimeout: 60s
    
  # Rate limiting
  rateLimit:
    qps: 10
    burst: 20

# CRD installation
crds:
  # Install CRDs
  install: true
  # Keep CRDs on uninstall
  keep: false

# Testing
testing:
  # Conformance testing
  conformance:
    enabled: false
    # Test configuration
    config:
      providers: ["libvirt", "vsphere"]
      skipTests: []
      
  # Load testing  
  loadTesting:
    enabled: false
    # Load test configuration
    config:
      vmCount: 10
      concurrency: 2
      duration: 300s

# CRD Upgrade configuration
# Automatically upgrades CRDs during helm upgrade (not just install)
crdUpgrade:
  # Enable automatic CRD upgrade via Helm hooks
  # When enabled, CRDs will be applied during both 'helm install' and 'helm upgrade'
  enabled: true
  
  # Image for kubectl container that applies CRDs  
  # Using our own kubectl image built from Alpine with kubectl and shell
  # This image is built and published as part of the VirtRigaud release process
  # Note: During development, this defaults to the current version, but in production
  #       it will be updated to match the release tag
  image:
    repository: ghcr.io/projectbeskar/virtrigaud/kubectl
    tag: "v0.3.0"  # Updated during release to match VirtRigaud version
    pullPolicy: IfNotPresent
  
  # Job configuration
  backoffLimit: 3  # Number of retries before considering job failed
  ttlSecondsAfterFinished: 300  # Cleanup job after 5 minutes
  waitSeconds: 5  # Wait time after applying CRDs for them to be established
  
  # Resources for the CRD upgrade job
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
