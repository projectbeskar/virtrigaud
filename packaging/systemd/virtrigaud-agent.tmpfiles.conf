# tmpfiles.d fragment for the per-host agent and its host key signer (development builds only). The
# state directory must be on persistent, block-device-backed storage; the
# provisioning step also writes the host's URI identity into
# /var/lib/virtrigaud-agent/host-id (mode 0600, owned by the agent's user).
d /var/lib/virtrigaud-agent      0700 virtrigaud-agent virtrigaud-agent -
d /var/lib/virtrigaud-agent/pki  0700 virtrigaud-agent virtrigaud-agent -
#
# The host key signer (vrtg-agent-signer.service) holds the host private key
# in its own state directory, which the agent's user cannot reach, and serves
# a Unix socket in /run/virtrigaud-signer: owned by the signer's user, group
# the agent's, setgid so that the socket takes the agent's group, no access
# for others. The provisioning step writes host.key there (mode 0600, owned by
# the signer's user); the agent's own pki directory holds the certificate only.
d /var/lib/virtrigaud-signer     0700 virtrigaud-signer virtrigaud-signer -
d /run/virtrigaud-signer         2750 virtrigaud-signer virtrigaud-agent -
