# tmpfiles.d fragment for the per-host agent (development builds only). The
# state directory must be on persistent, block-device-backed storage; the
# provisioning step also writes the host's URI identity into
# /var/lib/virtrigaud-agent/host-id (mode 0600, owned by the agent's user).
d /var/lib/virtrigaud-agent      0700 virtrigaud-agent virtrigaud-agent -
d /var/lib/virtrigaud-agent/pki  0700 virtrigaud-agent virtrigaud-agent -
