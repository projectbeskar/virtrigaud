# sysusers.d fragment for the per-host agent and its host key signer
# (development builds only), installed as
# /usr/lib/sysusers.d/virtrigaud-agent.conf.
#
# Fixed ids, so that the users keep the ids that own their persistent state
# directories even where /etc/passwd is rebuilt at every boot. They are in the
# system range, away from both ends (dynamic system ids are drawn downwards
# from 999 by systemd-sysusers and upwards from 100 by some distributions'
# adduser). If an id is already taken, systemd-sysusers allocates another
# one instead; where /etc is rebuilt at every boot that id may then differ
# from one boot to the next. vrtg-agent-setup.service then fails and the
# units do not start: the state directories and host.key still belong to
# the old uid. That is fail-closed for the agent, but not confidential: the
# account that now holds the old uid (another service, or a user created
# later) can read the host key and the agent's state. Reserve both ids: check
# that they are free (getent passwd 564 565; getent group 564 565) before the
# first start, keep them out of other allocations (in the host image's
# sysusers.d or user management), or assign other free ids with a fragment
# of the same name in /etc/sysusers.d before the first start.
u virtrigaud-agent 564 "VirtRigaud per-host agent" /var/lib/virtrigaud-agent -
u virtrigaud-signer 565 "VirtRigaud per-host agent host key signer" /var/lib/virtrigaud-signer -
