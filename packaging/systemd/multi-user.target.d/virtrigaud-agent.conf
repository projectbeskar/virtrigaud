# Drop-in for multi-user.target, installed as
# /usr/lib/systemd/system/multi-user.target.d/virtrigaud-agent.conf
# (development builds only).
#
# Upholds= starts the two units whenever multi-user.target is active, also
# when they arrive in a system extension merged during the boot, which
# .wants links cannot do. The agent is not upheld (so it can be stopped for
# maintenance): vrtg-agent-boot-start.service starts it once per boot. The
# shutdown unit is upheld so that it is active, and its stop action armed,
# whenever the host is up; its stop action stops VMs only while the host
# shuts down, so Upholds= restarting it after a maintenance stop stops no VM.
[Unit]
Upholds=vrtg-vm-shutdown.service vrtg-agent-boot-start.service
