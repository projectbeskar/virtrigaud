# VirtualMachine lifecycle conformance tests.
#
# Variables: ${RUN}, ${TEST}, ${PROVIDER} and ${NAMESPACE} are set by vcts;
# ${IMAGE} must name an existing VMImage, in the run's namespace, that the
# Provider under test can boot: vcts run --provider <name> --set IMAGE=<vmimage>.
# See test/conformance/README.md for the format.

- name: vm-create-delete
  description: Create a VirtualMachine, wait until the Provider reports it running and Ready, check its status, then delete it and wait until it is gone.
  requiredCapabilities:
    - vm-create
    - vm-delete
  timeout: 20m
  labels:
    category: basic
    priority: high
  steps:
    - name: create-vmclass
      type: create
      resource:
        apiVersion: infra.virtrigaud.io/v1beta1
        kind: VMClass
        metadata:
          name: vcts-${RUN}-cd-class
        spec:
          cpu: 1
          memory: 1Gi

    - name: create-vm
      type: create
      resource:
        apiVersion: infra.virtrigaud.io/v1beta1
        kind: VirtualMachine
        metadata:
          name: vcts-${RUN}-cd-vm
        spec:
          providerRef:
            name: ${PROVIDER}
          classRef:
            name: vcts-${RUN}-cd-class
          imageRef:
            name: ${IMAGE}
          powerState: "On"
      validate:
        - path: .spec.powerState
          operator: eq
          value: "On"

    - name: wait-vm-ready-and-on
      type: wait
      timeout: 10m
      resource:
        apiVersion: infra.virtrigaud.io/v1beta1
        kind: VirtualMachine
        metadata:
          name: vcts-${RUN}-cd-vm
      waitFor:
        condition: Ready
      validate:
        - path: .status.powerState
          operator: eq
          value: "On"

    - name: validate-vm-status
      type: validate
      resource:
        apiVersion: infra.virtrigaud.io/v1beta1
        kind: VirtualMachine
        metadata:
          name: vcts-${RUN}-cd-vm
      validate:
        - path: .status.id
          operator: exists
        - path: .status.phase
          operator: eq
          value: Running
        - path: .status.boundProvider.name
          operator: eq
          value: ${PROVIDER}
        - path: .status.currentResources.cpu
          operator: eq
          value: 1
        - path: .status.currentResources.memoryMiB
          operator: eq
          value: 1024

    - name: delete-vm
      type: delete
      resource:
        apiVersion: infra.virtrigaud.io/v1beta1
        kind: VirtualMachine
        metadata:
          name: vcts-${RUN}-cd-vm

    - name: wait-vm-deleted
      type: wait
      timeout: 10m
      resource:
        apiVersion: infra.virtrigaud.io/v1beta1
        kind: VirtualMachine
        metadata:
          name: vcts-${RUN}-cd-vm
      waitFor:
        condition: Deleted

- name: vm-power-cycle
  description: Power a running VirtualMachine off and on again through spec.powerState and wait for the Provider to report each state.
  requiredCapabilities:
    - vm-create
    - vm-power
    - vm-delete
  timeout: 20m
  labels:
    category: basic
    priority: medium
  steps:
    - name: create-vmclass
      type: create
      resource:
        apiVersion: infra.virtrigaud.io/v1beta1
        kind: VMClass
        metadata:
          name: vcts-${RUN}-pc-class
        spec:
          cpu: 1
          memory: 1Gi

    - name: create-vm
      type: create
      resource:
        apiVersion: infra.virtrigaud.io/v1beta1
        kind: VirtualMachine
        metadata:
          name: vcts-${RUN}-pc-vm
        spec:
          providerRef:
            name: ${PROVIDER}
          classRef:
            name: vcts-${RUN}-pc-class
          imageRef:
            name: ${IMAGE}
          powerState: "On"

    - name: wait-vm-running
      type: wait
      timeout: 10m
      resource:
        apiVersion: infra.virtrigaud.io/v1beta1
        kind: VirtualMachine
        metadata:
          name: vcts-${RUN}-pc-vm
      waitFor:
        condition: Running
      validate:
        - path: .status.conditions[?(@.type=="Ready")].status
          operator: eq
          value: "True"

    - name: power-off-vm
      type: update
      resource:
        apiVersion: infra.virtrigaud.io/v1beta1
        kind: VirtualMachine
        metadata:
          name: vcts-${RUN}-pc-vm
        spec:
          powerState: "Off"

    - name: wait-vm-stopped
      type: wait
      timeout: 5m
      resource:
        apiVersion: infra.virtrigaud.io/v1beta1
        kind: VirtualMachine
        metadata:
          name: vcts-${RUN}-pc-vm
      waitFor:
        condition: Stopped

    - name: validate-vm-off
      type: validate
      resource:
        apiVersion: infra.virtrigaud.io/v1beta1
        kind: VirtualMachine
        metadata:
          name: vcts-${RUN}-pc-vm
      validate:
        - path: .status.powerState
          operator: eq
          value: "Off"
        - path: .status.phase
          operator: eq
          value: Stopped

    - name: power-on-vm
      type: update
      resource:
        apiVersion: infra.virtrigaud.io/v1beta1
        kind: VirtualMachine
        metadata:
          name: vcts-${RUN}-pc-vm
        spec:
          powerState: "On"

    - name: wait-vm-running-again
      type: wait
      timeout: 5m
      resource:
        apiVersion: infra.virtrigaud.io/v1beta1
        kind: VirtualMachine
        metadata:
          name: vcts-${RUN}-pc-vm
      waitFor:
        condition: Running
      validate:
        - path: .status.phase
          operator: eq
          value: Running
