# Pre-commit hooks for VirtRigaud
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.6.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
    args: ['--unsafe']  # Allow custom YAML tags used in Kubernetes
  - id: check-added-large-files
  - id: check-merge-conflict
  - id: mixed-line-ending

# Keep rev equal to GOLANGCI_LINT_VERSION in the Makefile (and the version in
# the CI workflow): .golangci.yml is a golangci-lint v2 configuration, which
# v1 cannot read. hack/verify-golangci-lint-version.sh enforces this.
# The v2 hooks take no --exclude-dirs flag (exclusions live in .golangci.yml).
# The golangci-lint hook reports only issues in code changed since HEAD and
# applies fixes (--fix); use golangci-lint-full, or `make lint`, for what CI
# checks.
- repo: https://github.com/golangci/golangci-lint
  rev: v2.12.2
  hooks:
  - id: golangci-lint-config-verify
  - id: golangci-lint

- repo: https://github.com/tekwizely/pre-commit-golang
  rev: v1.0.0-rc.1
  hooks:
  - id: go-fmt
    args: [-w]
  - id: go-vet-mod

- repo: https://github.com/adrienverge/yamllint
  rev: v1.35.1
  hooks:
  - id: yamllint
    args: [-c=.yamllint]

# VirtRigaud-specific hooks
- repo: local
  hooks:
  - id: gen-crds
    name: Generate CRDs
    entry: make gen-crds
    language: system
    files: ^(api/.*\.go)$
    pass_filenames: false

  - id: go-mod-tidy
    name: Go Mod Tidy
    entry: go mod tidy
    language: system
    files: ^go\.(mod|sum)$
    pass_filenames: false

  - id: generate-code
    name: Generate Go Code
    entry: make generate
    language: system
    files: ^(api/.*\.go)$
    pass_filenames: false
