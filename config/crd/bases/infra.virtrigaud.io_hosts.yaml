---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: hosts.infra.virtrigaud.io
spec:
  group: infra.virtrigaud.io
  names:
    kind: Host
    listKind: HostList
    plural: hosts
    shortNames:
    - hvh
    singular: host
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.health
      name: Health
      type: string
    - jsonPath: .spec.poolRef.name
      name: Pool
      type: string
    - jsonPath: .spec.schedulable
      name: Schedulable
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          Host is the Schema for the hosts API: one bare hypervisor host registered into
          a clustered Provider's HostPool (ADR-0007 P1 inventory foundation). It is
          additive and does not affect single-host (spec.topology=single) providers
          (ADR-0007 D9).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              HostSpec is admin-authored desired inventory: one bare hypervisor host that a
              clustered Provider (spec.topology=cluster, ADR-0007) executes on. The admin
              declares which hosts exist; the provider reports what they can do right now
              (see HostStatus).
            properties:
              credentialSecretRef:
                description: |-
                  CredentialSecretRef optionally overrides the Provider's credentials for
                  this host (SSH key / known_hosts material). Defaults to the Provider's.
                properties:
                  name:
                    description: Name of the referenced object
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  namespace:
                    description: Namespace of the referenced object (defaults to current
                      namespace)
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
              endpoint:
                description: |-
                  Endpoint is the host connection URI (libvirt: qemu+ssh://user@host/system;
                  a future cloud-hypervisor host-agent: grpc://host:port).
                type: string
              labels:
                additionalProperties:
                  type: string
                description: |-
                  Labels are placement facts: storage-pool visibility, network/bridge
                  visibility, zone/rack. They are consumed as hard scheduling constraints
                  (ADR-0007 D6), e.g. {"storage.virtrigaud.io/pool-nfs01":"true",
                  "net.virtrigaud.io/br-vlan100":"true","topology.virtrigaud.io/rack":"r7"}.
                type: object
              poolRef:
                description: |-
                  PoolRef is the HostPool this host belongs to. Membership is declared by the
                  host itself (Host.spec.poolRef -> HostPool), per ADR-0007 D3.
                properties:
                  name:
                    description: Name of the referenced object
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
              providerRef:
                description: ProviderRef is the clustered Provider that executes on
                  this host.
                properties:
                  name:
                    description: Name of the referenced object
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  namespace:
                    description: Namespace of the referenced object (defaults to current
                      namespace)
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
              schedulable:
                default: true
                description: |-
                  Schedulable, when false, cordons the host: no new placement, existing VMs
                  stay. Set true->false to drain-then-evacuate (ADR-0007 D8). Defaults true.

                  This is a defaulted bool and deliberately carries NO omitempty: with
                  omitempty an explicit false would be dropped on marshal, the apiserver
                  would re-apply the true default, and the field would silently flip
                  false->true (the defaulted-bool footgun, ADR-0006/PR#235).
                type: boolean
            required:
            - endpoint
            - poolRef
            - providerRef
            type: object
          status:
            description: |-
              HostStatus is operator-synced observed state from ListHosts/GetHostInfo. It
              carries capacity and health only, never connection secrets (ADR-0007
              Security).
            properties:
              allocatableCPU:
                description: AllocatableCPU is the schedulable vCPU capacity the provider
                  reports live.
                format: int32
                type: integer
              allocatableMemoryMiB:
                description: |-
                  AllocatableMemoryMiB is the schedulable memory in MiB the provider reports
                  live.
                format: int64
                type: integer
              allocatableStorageBytes:
                description: |-
                  AllocatableStorageBytes is the schedulable storage in bytes the provider
                  reports live.
                format: int64
                type: integer
              boundVMs:
                description: |-
                  BoundVMs is the count of VMs the operator has bound to this host. It is
                  derived from VirtualMachine status, not from the provider — the operator
                  owns the binding (ADR-0007 D1).
                format: int32
                type: integer
              conditions:
                description: Conditions represent the latest available observations
                  of the host's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              cpuFeatures:
                description: |-
                  CPUFeatures are the host CPU features, driving the migration
                  CPU-compatibility pre-check.
                items:
                  type: string
                type: array
              cpuModel:
                description: |-
                  CPUModel is the host CPU baseline model, driving the migration
                  CPU-compatibility pre-check (virsh cpu-baseline / cpu-compare).
                type: string
              emulatorVersion:
                description: |-
                  EmulatorVersion is the host emulator version, gating the emulator match
                  required for live migration.
                type: string
              health:
                description: |-
                  Health is the live host health (libvirtd reachable / agent reachable + CH
                  runnable).
                enum:
                - Ready
                - NotReady
                - Unknown
                type: string
              lastHeartbeatTime:
                description: LastHeartbeatTime is when the operator last successfully
                  synced this host.
                format: date-time
                type: string
              machineTypes:
                description: |-
                  MachineTypes are the machine types the host supports, gating the
                  machine-type match required for live migration.
                items:
                  type: string
                type: array
              observedGeneration:
                description: |-
                  ObservedGeneration reflects the generation of the Host spec observed by the
                  controller.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
