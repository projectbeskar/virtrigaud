                        description: ChecksumType specifies the checksum algorithm
                        enum:
                        - md5
                        - sha1
                        - sha256
                        - sha512
                        type: string
                      headers:
                        additionalProperties:
                          type: string
                        description: Headers contains HTTP headers to include in the
