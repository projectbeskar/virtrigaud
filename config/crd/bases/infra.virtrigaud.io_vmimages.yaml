                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - image
                    type: object
                  vsphere:
                    description: VSphere contains vSphere-specific image configuration
