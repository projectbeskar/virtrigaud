---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: vmclasses.infra.virtrigaud.io
spec:
  group: infra.virtrigaud.io
  names:
    kind: VMClass
    listKind: VMClassList
    plural: vmclasses
    shortNames:
    - vmclass
    singular: vmclass
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.cpu
      name: CPU
      type: integer
    - jsonPath: .spec.memory
      name: Memory
      type: string
    - jsonPath: .spec.firmware
      name: Firmware
      type: string
    - jsonPath: .status.usedByVMs
      name: Used By
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          VMClass is a reusable hardware profile for VirtualMachines: vCPU count,
          memory, firmware and optional disk, performance and security settings. A
          VirtualMachine names it in spec.classRef.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              VMClassSpec defines the desired state of VMClass. A VMClass is a reusable
              hardware profile that VirtualMachines name in spec.classRef. cpu and
              memory are acted on by the vSphere, libvirt and Proxmox providers (the mock
              provider ignores the class); the other fields are acted on only
              by the providers named in their descriptions, and some are accepted but
              not acted on in this release.
            properties:
              consumerNamespaceSelector:
                description: |-
                  ConsumerNamespaceSelector selects the namespaces, other than this
                  VMClass's own, that may use it: VirtualMachines there may name it in
                  spec.classRef. A reference from the VMClass's own namespace is always
                  allowed.

                    - unset (the default): only its own namespace may use it.
                    - {} (an empty selector): every namespace may use it.
                    - matchLabels / matchExpressions: the namespaces whose labels match. The
                      kubernetes.io/metadata.name label names a namespace explicitly.

                  A reference from a namespace it does not select is refused with
                  Ready=False, reason ConsumerNotAllowed, and no provider call is made for
                  it. The selector is matched against Namespace labels, so whoever can label
                  a namespace can widen what that namespace may use (see
                  docs/cross-namespace-references.md). The selector is operator-side policy:
                  it is never sent to a provider.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              cpu:
                description: |-
                  CPU specifies the number of virtual CPUs. A VirtualMachine's
                  spec.resources.cpu overrides it for that VirtualMachine. On a clustered
                  Provider it is also the CPU the VirtualMachine takes from its host.
                format: int32
                maximum: 128
                minimum: 1
                type: integer
              diskDefaults:
                description: |-
                  DiskDefaults provides default disk settings. Only size is acted on:
                  libvirt sizes the root disk to it (20GiB when diskDefaults is unset; a
                  disk grown from an image is never shrunk, and libvirt also grows the root
                  disk to it on a later reconfigure) and vSphere grows the root disk to it
                  after creation (it never shrinks a disk). type, iops and storageClass are
                  accepted but not acted on in this release. Proxmox and mock ignore the block.
                properties:
                  iops:
                    description: |-
                      IOPS specifies the default IOPS limit. Accepted but not acted on in
                      this release.
                    format: int32
                    maximum: 100000
                    minimum: 100
                    type: integer
                  size:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 40Gi
                    description: |-
                      Size specifies the default root disk size. libvirt sizes the root disk
                      to it (a disk grown from an image is never shrunk) and vSphere grows the
                      root disk to it after creation (it never shrinks a disk); Proxmox and mock
                      ignore it. It must be
                      non-negative and below 1Pi: every value below 900Ti written in bytes,
                      k/Ki, M/Mi, G/Gi or T/Ti is accepted, and nothing at or above 1Pi is.
                      That is more than ten times the largest single virtual disk vSphere
                      supports (62 TB), and keeps the GiB value the provider contract carries
                      far inside its int32 range. The rules bound the number of integer
                      digits per unit suffix with core CEL only (no quantity library, which
                      Kubernetes < 1.29 lacks), so they are enforced on every supported
                      Kubernetes version.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                    x-kubernetes-validations:
                    - message: diskDefaults.size must be a non-negative quantity below
                        1Pi
                      rule: 'type(self) == int ? (self >= 0 && self < 1000000000000000)
                        : self.matches(''^[+]?[0-9.]*(k|Ki|Mi?|Gi?|Ti?|[mun]|[eE]([+]?0*(1[0-4]|[0-9])|-[0-9]+))?$'')'
                    - message: diskDefaults.size must be a non-negative quantity below
                        1Pi
                      rule: type(self) == int || ((self.matches('[a-zA-Z]') || !self.matches('^[+]?0*[1-9][0-9]{15}'))
                        && (!self.matches('(k|Ki)$') || !self.matches('^[+]?0*[1-9][0-9]{12}'))
                        && (!self.matches('Mi?$') || !self.matches('^[+]?0*[1-9][0-9]{9}')))
                    - message: diskDefaults.size must be a non-negative quantity below
                        1Pi
                      rule: type(self) == int || ((!self.matches('Gi?$') || !self.matches('^[+]?0*[1-9][0-9]{6}'))
                        && (!self.matches('Ti?$') || !self.matches('^[+]?0*[1-9][0-9]{3}'))
                        && (!self.matches('[mun]$') || !self.matches('^[+]?0*[1-9][0-9]{18}')))
                    - message: diskDefaults.size must be a non-negative quantity below
                        1Pi
                      rule: type(self) == int || ((!self.matches('[eE][+]?0*[0-9]$')
                        || !self.matches('^[+]?0*[1-9][0-9]{6}')) && (!self.matches('[eE][+]?0*1[0-4]$')
                        || !self.matches('^[+]?0*[1-9][0-9]')) && (!self.matches('[eE]-')
                        || !self.matches('^[+]?0*[1-9][0-9]{15}')))
                  storageClass:
                    description: |-
                      StorageClass specifies the default storage class. Accepted but not
                      acted on in this release.
                    maxLength: 253
                    type: string
                  type:
                    default: thin
                    description: |-
                      Type specifies the default disk type. Accepted but not acted on in this
                      release.
                    enum:
                    - thin
                    - thick
                    - eagerzeroedthick
                    - ssd
                    - hdd
                    - nvme
                    type: string
                type: object
              extraConfig:
                additionalProperties:
                  type: string
                description: |-
                  ExtraConfig contains provider-specific extra configuration. Only the
                  vSphere provider reads it, and only the key vsphere.hardwareVersion
                  (the VM hardware version, for example 21). Any other key, and every key
                  on libvirt, Proxmox and mock, is accepted but not acted on in this
                  release.
                maxProperties: 50
                type: object
              firmware:
                allOf:
                - enum:
                  - BIOS
                  - UEFI
                  - EFI
                - enum:
                  - BIOS
                  - UEFI
                  - EFI
                default: BIOS
                description: |-
                  Firmware specifies the firmware type: BIOS (the default) or UEFI. The
                  vSphere and libvirt providers read it: UEFI selects EFI firmware and any
                  other value (EFI included) selects BIOS, except that
                  securityProfile.secureBoot (and, on vSphere, tpmEnabled) force EFI
                  firmware. On libvirt, UEFI is OVMF without Secure Boot on the q35
                  machine type, chosen by libvirt from the host's installed firmware
                  (docs/libvirt-firmware.md). Proxmox and mock ignore this field.
                type: string
              guestToolsPolicy:
                default: install
                description: |-
                  GuestToolsPolicy specifies guest tools installation policy. Accepted
                  but not acted on in this release. The value is sent to the provider,
                  but no provider acts on it.
                enum:
                - install
                - skip
                - upgrade
                - uninstall
                type: string
              memory:
                anyOf:
                - type: integer
                - type: string
                description: |-
                  Memory specifies memory allocation using Kubernetes resource
                  quantities. A VirtualMachine's spec.resources.memoryMiB overrides it
                  for that VirtualMachine. It must be non-negative and below 100Ti: every
                  value below 90Ti written in bytes, k/Ki, M/Mi, G/Gi or T/Ti is
                  accepted, and nothing at or above 100Ti is. That is more than three
                  times the largest VM any supported hypervisor runs (24 TB on vSphere
                  8), and keeps the MiB value the provider contract carries far inside
                  its int32 range. The rules bound the number of integer digits per unit
                  suffix with core CEL only (no quantity library, which Kubernetes < 1.29
                  lacks), so they are enforced on every supported Kubernetes version.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
                x-kubernetes-validations:
                - message: memory must be a non-negative quantity below 100Ti
                  rule: 'type(self) == int ? (self >= 0 && self < 100000000000000)
                    : self.matches(''^[+]?[0-9.]*(k|Ki|Mi?|Gi?|Ti?|[mun]|[eE]([+]?0*(1[0-3]|[0-9])|-[0-9]+))?$'')'
                - message: memory must be a non-negative quantity below 100Ti
                  rule: type(self) == int || ((self.matches('[a-zA-Z]') || !self.matches('^[+]?0*[1-9][0-9]{14}'))
                    && (!self.matches('(k|Ki)$') || !self.matches('^[+]?0*[1-9][0-9]{11}'))
                    && (!self.matches('Mi?$') || !self.matches('^[+]?0*[1-9][0-9]{8}')))
                - message: memory must be a non-negative quantity below 100Ti
                  rule: type(self) == int || ((!self.matches('Gi?$') || !self.matches('^[+]?0*[1-9][0-9]{5}'))
                    && (!self.matches('Ti?$') || !self.matches('^[+]?0*[1-9][0-9]{2}'))
                    && (!self.matches('[mun]$') || !self.matches('^[+]?0*[1-9][0-9]{17}')))
                - message: memory must be a non-negative quantity below 100Ti
                  rule: type(self) == int || ((!self.matches('[eE][+]?0*[0-9]$') ||
                    !self.matches('^[+]?0*[1-9][0-9]{5}')) && (!self.matches('[eE][+]?0*1[0-3]$')
                    || !self.matches('^[+]?0*[1-9][0-9]')) && (!self.matches('[eE]-')
                    || !self.matches('^[+]?0*[1-9][0-9]{14}')))
              performanceProfile:
                description: |-
                  PerformanceProfile defines performance-related settings.
                  nestedVirtualization, cpuHotAddEnabled and memoryHotAddEnabled are
                  acted on by vSphere and libvirt, and virtualizationBasedSecurity by
                  vSphere only; latencySensitivity and hyperThreadingPolicy are accepted
                  but not acted on in this release. Proxmox and mock ignore the block.
                properties:
                  cpuHotAddEnabled:
                    default: false
                    description: |-
                      CPUHotAddEnabled allows adding CPUs while the VM is running. libvirt
                      provisions headroom for live vCPU growth; vSphere enables CPU hot-add,
                      except when nestedVirtualization is also set (the combination is not
                      supported there, and hot-add is skipped). Proxmox and mock ignore it.
                    type: boolean
                  hyperThreadingPolicy:
                    default: auto
                    description: |-
                      HyperThreadingPolicy controls hyperthreading usage. Accepted but not
                      acted on in this release.
                    enum:
                    - auto
                    - prefer
                    - avoid
                    - require
                    type: string
                  latencySensitivity:
                    default: normal
                    description: |-
                      LatencySensitivity configures latency sensitivity. Accepted but not
                      acted on in this release.
                    enum:
                    - low
                    - normal
                    - high
                    type: string
                  memoryHotAddEnabled:
                    default: false
                    description: |-
                      MemoryHotAddEnabled allows adding memory while the VM is running.
                      libvirt provisions a memory ceiling above the initial memory for live
                      growth; vSphere enables memory hot-add. On a clustered Provider the
                      scheduler also reserves that headroom on the host. Proxmox and mock
                      ignore it.
                    type: boolean
                  nestedVirtualization:
                    default: false
                    description: |-
                      NestedVirtualization enables nested virtualization. It is acted on by
                      vSphere and libvirt; on libvirt the host CPU is passed through
                      (host-passthrough), and the guest sees VT-x or AMD-V only when the
                      host's kvm_intel or kvm_amd module has nesting enabled. Proxmox and mock
                      ignore it.
                    type: boolean
                  virtualizationBasedSecurity:
                    default: false
                    description: |-
                      VirtualizationBasedSecurity enables VBS features. Only the vSphere
                      provider acts on it; libvirt, Proxmox and mock ignore it.
                    type: boolean
                type: object
              resourceLimits:
                description: |-
                  ResourceLimits defines resource limits and reservations. Accepted but
                  not acted on in this release. The values are sent to the provider, but
                  no provider applies them.
                properties:
                  cpuLimit:
                    description: |-
                      CPULimit is the maximum CPU usage limit (in MHz or percentage).
                      Accepted but not acted on in this release.
                    format: int32
                    maximum: 100000
                    minimum: 100
                    type: integer
                  cpuReservation:
                    description: |-
                      CPUReservation is the guaranteed CPU allocation (in MHz). Accepted but
                      not acted on in this release.
                    format: int32
                    maximum: 100000
                    minimum: 0
                    type: integer
                  cpuShares:
                    description: |-
                      CPUShares defines the relative CPU priority (higher = more priority).
                      Accepted but not acted on in this release.
                    format: int32
                    maximum: 1000000
                    minimum: 1
                    type: integer
                  memoryLimit:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      MemoryLimit is the maximum memory usage limit. Accepted but not acted
                      on in this release.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  memoryReservation:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      MemoryReservation is the guaranteed memory allocation. Accepted but not
                      acted on in this release.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                type: object
              securityProfile:
                description: |-
                  SecurityProfile defines security-related settings. secureBoot,
                  tpmEnabled and vtdEnabled are acted on by vSphere and libvirt;
                  tpmVersion and encryptionPolicy are accepted but not acted on in this
                  release. Proxmox and mock ignore the block.
                properties:
                  encryptionPolicy:
                    description: |-
                      EncryptionPolicy defines VM encryption settings. Accepted but not acted
                      on in this release.
                    properties:
                      enabled:
                        default: false
                        description: |-
                          Enabled indicates if encryption should be used. Accepted but not acted
                          on in this release.
                        type: boolean
                      keyProvider:
                        description: |-
                          KeyProvider specifies the encryption key provider. Accepted but not
                          acted on in this release.
                        enum:
                        - standard
                        - hardware
                        - external
                        type: string
                      requireEncryption:
                        default: false
                        description: |-
                          RequireEncryption mandates encryption (fails if not available).
                          Accepted but not acted on in this release.
                        type: boolean
                    type: object
                  secureBoot:
                    default: false
                    description: |-
                      SecureBoot enables secure boot. vSphere forces EFI firmware and enables
                      secure boot; libvirt has libvirt select a Secure Boot OVMF build with the
                      default keys enrolled, with SMM, on the q35 machine type (the host needs
                      an OVMF package; docs/libvirt-firmware.md). Proxmox and mock ignore it.
                    type: boolean
                  tpmEnabled:
                    default: false
                    description: |-
                      TPMEnabled enables TPM (Trusted Platform Module). vSphere adds a
                      virtual TPM and forces EFI firmware; libvirt adds an emulated TPM.
                      Proxmox and mock ignore it.
                    type: boolean
                  tpmVersion:
                    description: |-
                      TPMVersion specifies the TPM version. Accepted but not acted on in this
                      release. libvirt always emulates TPM 2.0, and vSphere adds its virtual
                      TPM, whatever is set here.
                    enum:
                    - 1.2
                    - 2
                    type: string
                  vtdEnabled:
                    default: false
                    description: |-
                      VTDEnabled enables Intel VT-d or AMD-Vi. vSphere sets vvtd.enable;
                      libvirt adds an emulated Intel IOMMU with interrupt remapping, which
                      needs the q35 machine type. Proxmox and mock ignore it.
                    type: boolean
                type: object
            required:
            - cpu
            - memory
            type: object
          status:
            description: |-
              VMClassStatus defines the observed state of VMClass. Not populated in
              this release. No controller writes the status of a VMClass.
            properties:
              conditions:
                description: |-
                  Conditions represent the latest available observations. Not populated
                  in this release.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: |-
                  ObservedGeneration reflects the generation observed by the controller.
                  Not populated in this release.
                format: int64
                type: integer
              supportedProviders:
                description: |-
                  SupportedProviders lists the providers that support this class. Not
                  populated in this release.
                items:
                  type: string
                type: array
              usedByVMs:
                description: |-
                  UsedByVMs is the number of VMs currently using this class. Not
                  populated in this release.
                format: int32
                type: integer
              validationResults:
                additionalProperties:
                  description: |-
                    ValidationResult represents a validation result for a provider. Not
                    populated in this release.
                  properties:
                    lastValidated:
                      description: |-
                        LastValidated is when this validation was last performed. Not populated
                        in this release.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        Message provides details about the validation result. Not populated in
                        this release.
                      type: string
                    valid:
                      description: |-
                        Valid indicates if the class is valid for the provider. Not populated
                        in this release.
                      type: boolean
                    warnings:
                      description: Warnings lists any validation warnings. Not populated
                        in this release.
                      items:
                        type: string
                      type: array
                  required:
                  - valid
                  type: object
                description: |-
                  ValidationResults contains validation results for different providers.
                  Not populated in this release.
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
