                  targetSize:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      TargetSize is the target disk size in bytes. Not populated in this
                      release.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                type: object
              exportID:
                description: ExportID is the export operation identifier the source
                  provider returned.
                type: string
              importID:
                description: |-
                  ImportID is the disk identifier the target provider returned for the
                  imported disk.
                type: string
              lastRetryTime:
                description: LastRetryTime is when the migration was last retried
                format: date-time
                type: string
              message:
                description: Message provides additional details about the current
                  state
                type: string
              observedGeneration:
                description: ObservedGeneration reflects the generation observed by
                  the controller
                format: int64
                type: integer
              phase:
                description: |-
