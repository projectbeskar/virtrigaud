                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              diskInfo:
                description: |-
                  DiskInfo contains information about the migrated disk, recorded when the
                  ExportDisk and ImportDisk calls return (which can be before an
                  asynchronous task finishes).
                properties:
                  checksum:
                    description: |-
                      Checksum is the SHA256 checksum of the disk. Not populated in this release;
                      see sourceChecksum and targetChecksum.
                    type: string
                  sourceChecksum:
                    description: SourceChecksum is the SHA256 checksum of the source
                      disk
                    type: string
                  sourceDiskID:
                    description: SourceDiskID is the source disk identifier
                    type: string
                  sourceFormat:
                    description: SourceFormat is the source disk format
                    type: string
                  sourceSize:
                    anyOf:
                    - type: integer
                    - type: string
                    description: SourceSize is the source disk size in bytes
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
