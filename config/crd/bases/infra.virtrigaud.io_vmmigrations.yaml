                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
              targetVMUID:
                description: |-
                  TargetVMUID is the UID of the target VirtualMachine this migration
                  created, recorded from the response of its own Create (or, when that
                  record was lost, from the VirtualMachine that carries this migration's
                  claim, see targetVMClaim). Every later step — waiting for the target,
                  validating it, marking it migration-completed, deleting a partial one —
                  acts only on the VirtualMachine with this UID: another VirtualMachine
                  under the target's name (one created by someone else, before or after
                  the migration's own) fails the migration and is never touched. Written
                  by the controller only.
                maxLength: 128
                type: string
              taskRef:
                description: TaskRef is the current task reference for async operations
                type: string
              validationResults:
                description: |-
                  ValidationResults contains results of validation checks. Not populated in
                  this release.
                properties:
                  bootSuccess:
                    description: BootSuccess indicates if the target VM booted successfully
                    type: boolean
                  checksumMatch:
                    description: ChecksumMatch indicates if checksums match
                    type: boolean
                  connectivitySuccess:
                    description: ConnectivitySuccess indicates if network connectivity
                      works
                    type: boolean
                  diskSizeMatch:
                    description: DiskSizeMatch indicates if disk sizes match
                    type: boolean
                  validationErrors:
                    description: ValidationErrors lists any validation errors
                    items:
                      type: string
                    type: array
                type: object
            type: object
        type: object
