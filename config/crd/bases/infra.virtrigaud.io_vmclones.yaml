metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: vmclones.infra.virtrigaud.io
spec:
  group: infra.virtrigaud.io
  names:
    kind: VMClone
    listKind: VMCloneList
    plural: vmclones
    shortNames:
    - vmclone
    singular: vmclone
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
