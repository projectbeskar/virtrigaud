---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: vmsets.infra.virtrigaud.io
spec:
  group: infra.virtrigaud.io
  names:
    kind: VMSet
    listKind: VMSetList
    plural: vmsets
    shortNames:
    - vmset
    singular: vmset
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.replicas
      name: Desired
      type: integer
    - jsonPath: .status.replicas
      name: Current
      type: integer
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .status.updatedReplicas
      name: Updated
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          VMSet is the Schema for the vmsets API. It has no active controller in this
          release: the controller only sets the condition Ready=False with the reason
          ControllerNotImplemented on each VMSet, and creates, scales and updates no
          VMs. Every spec field is accepted but not acted on in this release, and
          status is not populated apart from that condition and observedGeneration.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              VMSetSpec defines the desired state of VMSet. VMSet has no active
              controller in this release, so every field is accepted but not acted on: no
              VMs are created from the template.
            properties:
              minReadySeconds:
                description: |-
                  MinReadySeconds is the minimum number of seconds for which a newly created
                  VM should be ready before it is considered available. Accepted but not
                  acted on in this release.
                format: int32
                maximum: 3600
                minimum: 0
                type: integer
              ordinals:
                description: |-
                  Ordinals configures the sequential ordering of VM indices. Accepted but
                  not acted on in this release.
                properties:
                  start:
                    default: 0
                    description: |-
                      Start is the number representing the first replica's index. Accepted but
                      not acted on in this release.
                    format: int32
                    maximum: 999999
                    minimum: 0
                    type: integer
                type: object
              persistentVolumeClaimRetentionPolicy:
                description: |-
                  PersistentVolumeClaimRetentionPolicy defines the retention policy for
                  PVCs. Accepted but not acted on in this release.
                properties:
                  whenDeleted:
                    allOf:
                    - enum:
                      - Retain
                      - Delete
                    - enum:
                      - Retain
                      - Delete
                    default: Retain
                    description: |-
                      WhenDeleted specifies what happens to PVCs created from VMSet
                      VolumeClaimTemplates when the VMSet is deleted. Accepted but not acted on
                      in this release.
                    type: string
                  whenScaled:
                    allOf:
                    - enum:
                      - Retain
                      - Delete
                    - enum:
                      - Retain
                      - Delete
                    default: Retain
                    description: |-
                      WhenScaled specifies what happens to PVCs created from VMSet
                      VolumeClaimTemplates when the VMSet is scaled down. Accepted but not acted
                      on in this release.
                    type: string
                type: object
              replicas:
                default: 1
                description: |-
                  Replicas is the desired number of VMs in the set. Accepted but not acted
                  on in this release.
                format: int32
                maximum: 1000
                minimum: 0
                type: integer
              revisionHistoryLimit:
                default: 10
                description: |-
                  RevisionHistoryLimit is the number of old VMSets to retain. Accepted but
                  not acted on in this release.
                format: int32
                maximum: 100
                minimum: 0
                type: integer
              selector:
                description: |-
                  Selector is a label query over VMs that should match the replica count.
                  Accepted but not acted on in this release.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              serviceName:
                description: |-
                  ServiceName is the name of the service that governs this VMSet. Accepted
                  but not acted on in this release.
                maxLength: 253
                type: string
              template:
                description: |-
                  Template describes the VMs the set is meant to run.
                  Accepted but not acted on in this release.
                properties:
                  metadata:
                    description: ObjectMeta is the metadata of the VMs the template
                      describes
                    type: object
                  spec:
                    description: Spec is the VM specification. Accepted but not acted
                      on in this release.
                    properties:
                      classRef:
                        description: ClassRef references the VMClass that defines
                          resource allocation
                        properties:
                          name:
                            description: Name of the referenced object
                            maxLength: 253
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                            type: string
                          namespace:
                            description: Namespace of the referenced object (defaults
                              to current namespace)
                            maxLength: 63
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                            type: string
                        required:
                        - name
                        type: object
                      disks:
                        description: |-
                          Disks specifies additional disks beyond the root disk. The vSphere provider
                          attaches them at create. The libvirt and Proxmox providers attach none: a VM
                          on such a Provider reports DisksApplied=False (reason
                          NotSupportedByProvider), and the spec is not refused.
                        items:
                          description: DiskSpec defines a disk configuration
                          properties:
                            expandPolicy:
                              default: Offline
                              description: |-
                                ExpandPolicy defines how the disk can be expanded. Accepted but not acted on
                                in this release: it is not sent to the provider.
                              enum:
                              - Online
                              - Offline
                              type: string
                            name:
                              description: Name is the disk identifier
                              maxLength: 63
                              pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                              type: string
                            scsi:
                              description: |-
                                SCSI specifies SCSI controller configuration (vSphere only). Accepted but not
                                acted on in this release: the manager sends only the disk's name, sizeGiB
                                and type to the provider.
                              properties:
                                controller:
                                  description: |-
                                    Controller specifies the SCSI controller bus number (0-3)
                                    If not specified, uses the first available controller
                                  format: int32
                                  maximum: 3
                                  minimum: 0
                                  type: integer
                                controllerType:
                                  default: pvscsi
                                  description: ControllerType specifies the SCSI controller
                                    type
                                  enum:
                                  - lsilogic
                                  - buslogic
                                  - lsilogic-sas
                                  - pvscsi
                                  type: string
                                sharedBus:
                                  default: noSharing
                                  description: SharedBus specifies the SCSI bus sharing
                                    mode
                                  enum:
                                  - noSharing
                                  - virtualSharing
                                  - physicalSharing
                                  type: string
                              type: object
                            sizeGiB:
                              description: SizeGiB is the size of the disk in GiB
                              format: int32
                              maximum: 65536
                              minimum: 1
                              type: integer
                            storageClass:
                              description: |-
                                StorageClass specifies the storage class (optional). Accepted but not acted
                                on in this release: it is not sent to the provider.
                              type: string
                            type:
                              default: thin
                              description: Type specifies the disk type (provider-specific)
                              enum:
                              - thin
                              - thick
                              - eagerzeroedthick
                              - ssd
                              - hdd
                              type: string
                          required:
                          - name
                          - sizeGiB
                          type: object
                        maxItems: 20
                        type: array
                      imageRef:
                        description: |-
                          ImageRef references the VMImage to use as base template.
                          Either ImageRef or ImportedDisk must be specified, but not both.
                        properties:
                          name:
                            description: Name of the referenced object
                            maxLength: 253
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                            type: string
                          namespace:
                            description: Namespace of the referenced object (defaults
                              to current namespace)
                            maxLength: 63
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                            type: string
                        required:
                        - name
                        type: object
                      importedDisk:
                        description: |-
                          ImportedDisk references a pre-imported disk (e.g., from migration).
                          Either ImageRef or ImportedDisk must be specified, but not both.
                        properties:
                          diskID:
                            description: |-
                              DiskID is the provider-specific disk identifier.
                              For libvirt, this is typically the volume name. Empty only on a
                              migration's target VirtualMachine that waits for its import
                              (MigrationRef set).
                            maxLength: 253
                            type: string
                          format:
                            default: qcow2
                            description: Format specifies the disk format (qcow2,
                              vmdk, raw, etc.).
                            enum:
                            - qcow2
                            - vmdk
                            - raw
                            - vdi
                            - vhdx
                            type: string
                          migrationRef:
                            description: |-
                              MigrationRef references the VMMigration that imported this disk.
                              This provides traceability and audit trail for migrated disks.
                            properties:
                              name:
                                description: Name of the referenced object
                                maxLength: 253
                                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                                type: string
                            required:
                            - name
                            type: object
                          path:
                            description: |-
                              Path is the optional disk path on the provider (e.g., /var/lib/libvirt/images/disk.qcow2).
                              If not specified, the provider will determine the path based on DiskID.
                            type: string
                          sizeGiB:
                            description: |-
                              SizeGiB specifies the expected disk size in GiB.
                              Used for validation and capacity planning.
                            format: int32
                            minimum: 1
                            type: integer
                          source:
                            description: Source indicates where the disk came from.
                            enum:
                            - migration
                            - clone
                            - import
                            - snapshot
                            - manual
                            type: string
                        required:
                        - diskID
                        type: object
                        x-kubernetes-validations:
                        - message: importedDisk.diskID may be empty only while importedDisk.migrationRef
                            names the VMMigration that imports the disk
                          rule: size(self.diskID) > 0 || has(self.migrationRef)
                      lifecycle:
                        description: |-
                          Lifecycle defines VM lifecycle configuration. Accepted but not acted on in
                          this release: no preStop or postStart handler runs and
                          gracefulShutdownTimeout is not used.
                        properties:
                          gracefulShutdownTimeout:
                            default: 60s
                            description: |-
                              GracefulShutdownTimeout defines how long to wait for graceful shutdown.
                              Accepted but not acted on in this release.
                            type: string
                          postStart:
                            description: |-
                              PostStart defines actions to take after starting the VM. Accepted but not
                              acted on in this release.
                            properties:
                              exec:
                                description: Exec specifies a command to execute
                                properties:
                                  command:
                                    description: Command is the command line to execute
                                    items:
                                      type: string
                                    minItems: 1
                                    type: array
                                required:
                                - command
                                type: object
                              httpGet:
                                description: HTTPGet specifies an HTTP GET request
                                properties:
                                  host:
                                    description: Host name to connect to (defaults
                                      to VM IP)
                                    type: string
                                  path:
                                    description: Path is the HTTP path to access
                                    type: string
                                  port:
                                    description: Port is the port to access
                                    format: int32
                                    maximum: 65535
                                    minimum: 1
                                    type: integer
                                  scheme:
                                    default: HTTP
                                    description: Scheme to use for connecting (HTTP
                                      or HTTPS)
                                    enum:
                                    - HTTP
                                    - HTTPS
                                    type: string
                                required:
                                - port
                                type: object
                              snapshot:
                                description: Snapshot specifies a snapshot to create
                                properties:
                                  description:
                                    description: Description provides context for
                                      the snapshot
                                    type: string
                                  includeMemory:
                                    description: IncludeMemory indicates whether to
                                      include memory state
                                    type: boolean
                                  name:
                                    description: Name is the name hint for the snapshot
                                    type: string
                                required:
                                - name
                                type: object
                            type: object
                          preStop:
                            description: |-
                              PreStop defines actions to take before stopping the VM. Accepted but not
                              acted on in this release.
                            properties:
                              exec:
                                description: Exec specifies a command to execute
                                properties:
                                  command:
                                    description: Command is the command line to execute
                                    items:
                                      type: string
                                    minItems: 1
                                    type: array
                                required:
                                - command
                                type: object
                              httpGet:
                                description: HTTPGet specifies an HTTP GET request
                                properties:
                                  host:
                                    description: Host name to connect to (defaults
                                      to VM IP)
                                    type: string
                                  path:
                                    description: Path is the HTTP path to access
                                    type: string
                                  port:
                                    description: Port is the port to access
                                    format: int32
                                    maximum: 65535
                                    minimum: 1
                                    type: integer
                                  scheme:
                                    default: HTTP
                                    description: Scheme to use for connecting (HTTP
                                      or HTTPS)
                                    enum:
                                    - HTTP
                                    - HTTPS
                                    type: string
                                required:
                                - port
                                type: object
                              snapshot:
                                description: Snapshot specifies a snapshot to create
                                properties:
                                  description:
                                    description: Description provides context for
                                      the snapshot
                                    type: string
                                  includeMemory:
                                    description: IncludeMemory indicates whether to
                                      include memory state
                                    type: boolean
                                  name:
                                    description: Name is the name hint for the snapshot
                                    type: string
                                required:
                                - name
                                type: object
                            type: object
                        type: object
                      metaData:
                        description: MetaData contains cloud-init metadata configuration
                        properties:
                          cloudInit:
                            description: CloudInit contains cloud-init metadata configuration
                            properties:
                              inline:
                                description: Inline contains inline cloud-init metadata
                                  in YAML format
                                type: string
                              secretRef:
                                description: SecretRef references a Secret containing
                                  cloud-init metadata
                                properties:
                                  name:
                                    description: Name of the referenced object
                                    maxLength: 253
                                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                                    type: string
                                required:
                                - name
                                type: object
                            type: object
                        type: object
                      networks:
                        description: Networks specifies network attachments for the
                          VM
                        items:
                          description: VMNetworkRef represents a reference to a network
                            attachment
                          properties:
                            dns:
                              description: DNS specifies DNS server IP addresses (comma-separated)
                              type: string
                            gateway:
                              description: Gateway specifies the default gateway IP
                                address
                              pattern: ^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$
                              type: string
                            ipAddress:
                              description: IPAddress specifies a static IP address
                                (optional)
                              pattern: ^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$
                              type: string
                            macAddress:
                              description: |-
                                MACAddress specifies a static MAC address (optional). Accepted but not acted
                                on in this release: it is not sent to the provider.
                              pattern: ^([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})$
                              type: string
                            name:
                              description: Name is the name of this network attachment
                              maxLength: 63
                              pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                              type: string
                            networkRef:
                              description: |-
                                NetworkRef references the VMNetworkAttachment (optional)
                                When not specified, the template's pre-configured network adapter is used.
                              properties:
                                name:
                                  description: Name of the referenced object
                                  maxLength: 253
                                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                                  type: string
                                namespace:
                                  description: Namespace of the referenced object
                                    (defaults to current namespace)
                                  maxLength: 63
                                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                                  type: string
                              required:
                              - name
                              type: object
                            prefix:
                              description: Prefix specifies the network prefix length
                                (e.g., 24 for /24)
                              format: int32
                              maximum: 32
                              minimum: 1
                              type: integer
                          required:
                          - name
                          type: object
                        maxItems: 10
                        type: array
                      placement:
                        description: |-
                          Placement provides hints for VM placement. Cluster, datastore, storagePod
                          and folder are sent to the provider with the create request and are used by
                          the vSphere provider only; the libvirt and Proxmox providers do not use
                          them when creating a VM. host and resourcePool are accepted but not acted
                          on in this release. On a clustered Provider the scheduler chooses the host
                          (see status.placement and spec.placementRef).
                        properties:
                          cluster:
                            description: Cluster specifies the target cluster
                            type: string
                          datastore:
                            description: |-
                              Datastore specifies the target datastore.
                              Mutually exclusive with StoragePod; Datastore takes precedence if both are set.
                            type: string
                          folder:
                            description: Folder specifies the target folder
                            type: string
                          host:
                            description: Host specifies the target host. Accepted
                              but not acted on in this release.
                            type: string
                          resourcePool:
                            description: |-
                              ResourcePool specifies the target resource pool. Accepted but not acted on
                              in this release.
                            type: string
                          storagePod:
                            description: |-
                              StoragePod specifies a vSphere Datastore Cluster (StoragePod) to use for automatic
                              datastore selection. The provider will pick the datastore within the cluster that
                              has the most free space. Ignored when Datastore is also set.
                            type: string
                        type: object
                      placementRef:
                        description: PlacementRef references a VMPlacementPolicy for
                          advanced placement rules
                        properties:
                          name:
                            description: Name of the referenced object
                            maxLength: 253
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                            type: string
                        required:
                        - name
                        type: object
                      powerState:
                        description: PowerState specifies the desired power state
                        enum:
                        - "On"
                        - "Off"
                        - OffGraceful
                        type: string
                      providerRef:
                        description: |-
                          ProviderRef references the Provider that manages this VM. On a
                          VirtualMachine it is immutable once the VM is bound to a hypervisor VM
                          (status.id or status.placement.pendingHost is set): every per-VM call
                          addresses the VM by its provider id, which is meaningful only on the
                          Provider that assigned it. Before binding (e.g. to fix a typo after a
                          failed create) it may still be changed. An unset namespace means the VM's
                          own; changing it from unset to an explicit namespace also counts as a
                          change.
                        properties:
                          name:
                            description: Name of the referenced object
                            maxLength: 253
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                            type: string
                          namespace:
                            description: Namespace of the referenced object (defaults
                              to current namespace)
                            maxLength: 63
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                            type: string
                        required:
                        - name
                        type: object
                      resources:
                        description: Resources allows overriding resource allocation
                          from the VMClass
                        properties:
                          cpu:
                            description: CPU specifies the number of virtual CPUs
                            format: int32
                            maximum: 128
                            minimum: 1
                            type: integer
                          gpu:
                            description: |-
                              GPU specifies GPU configuration. Accepted but not acted on in this release:
                              no GPU is requested from the provider.
                            properties:
                              count:
                                description: Count specifies the number of GPUs to
                                  assign
                                format: int32
                                maximum: 8
                                minimum: 1
                                type: integer
                              memory:
                                description: Memory specifies GPU memory in MiB
                                format: int64
                                minimum: 512
                                type: integer
                              type:
                                description: Type specifies the GPU type (provider-specific)
                                pattern: ^[a-zA-Z0-9-_]+$
                                type: string
                            required:
                            - count
                            type: object
                          memoryMiB:
                            description: MemoryMiB specifies the amount of memory
                              in MiB
                            format: int64
                            maximum: 1048576
                            minimum: 128
                            type: integer
                        type: object
                      snapshot:
                        description: Snapshot defines snapshot-related operations
                        properties:
                          revertToRef:
                            description: |-
                              RevertToRef names a VMSnapshot, in the VM's namespace, to revert the VM
                              to. The snapshot must have been taken of this VM (its spec.vmRef and
                              status.vmUID) and be Ready. The revert is sent only while the VM is
                              powered off and spec.powerState is Off or OffGraceful: the controller
                              never powers a VM off for a revert, and does not power it on afterwards
                              (spec.powerState decides that). It is sent at most once per request:
                              status.snapshotRevert records the outcome, and while the field stays set
                              to the same VMSnapshot nothing is sent again (a GitOps re-apply is a
                              no-op). To revert to the same snapshot again, remove the field, then set
                              it again; naming another VMSnapshot (another UID) is a new request.
                              The SnapshotReverted condition reports the progress.
                            properties:
                              name:
                                description: Name of the referenced object
                                maxLength: 253
                                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                                type: string
                            required:
                            - name
                            type: object
                        type: object
                      tags:
                        description: |-
                          Tags are sent to the provider with the create request. No provider applies
                          them to the hypervisor VM in this release.
                        items:
                          type: string
                        maxItems: 50
                        type: array
                      userData:
                        description: UserData contains cloud-init configuration
                        properties:
                          cloudInit:
                            description: CloudInit contains cloud-init configuration
                            properties:
                              inline:
                                description: Inline contains inline cloud-init data
                                type: string
                              secretRef:
                                description: SecretRef references a Secret containing
                                  cloud-init data
                                properties:
                                  name:
                                    description: Name of the referenced object
                                    maxLength: 253
                                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                                    type: string
                                required:
                                - name
                                type: object
                            type: object
                          ignition:
                            description: |-
                              Ignition contains Ignition configuration for CoreOS/RHEL. Accepted but not
                              acted on in this release: only cloudInit is sent to the provider.
                            properties:
                              inline:
                                description: Inline contains inline Ignition data
                                type: string
                              secretRef:
                                description: SecretRef references a Secret containing
                                  Ignition data
                                properties:
                                  name:
                                    description: Name of the referenced object
                                    maxLength: 253
                                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                                    type: string
                                required:
                                - name
                                type: object
                            type: object
                        type: object
                    required:
                    - classRef
                    - providerRef
                    type: object
                required:
                - spec
                type: object
