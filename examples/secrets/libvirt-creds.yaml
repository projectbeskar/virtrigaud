# Libvirt credentials secret for VirtRigaud
#
# The Libvirt provider reads credentials from the mounted secret.
# Supported keys:
#   ssh-privatekey  — private key for SSH transport (recommended)
#   username        — SSH username (required with ssh-privatekey or password)
#   password        — SSH password (less secure than key-based auth)
#   known_hosts     — the libvirt host's public key(s) in known_hosts format
#                     (required: the provider verifies the host key and does not
#                     trust on first use, ADR-0004; an absent or empty file makes
#                     the provider fail at startup)

---
# SSH key authentication (recommended):
apiVersion: v1
kind: Secret
metadata:
  name: libvirt-creds
  namespace: default
type: Opaque
stringData:
  username: "virtrigaud"
  # ssh-privatekey must be the raw PEM-encoded private key (not base64-encoded again)
  ssh-privatekey: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    REDACTED
    -----END OPENSSH PRIVATE KEY-----
  # For example the output of `ssh-keyscan -t ed25519 kvm-host.example.com`,
  # checked against the host's own fingerprint.
  known_hosts: |
    kvm-host.example.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIREPLACE_WITH_HOST_KEY

---
# Password authentication (less secure):
apiVersion: v1
kind: Secret
metadata:
  name: libvirt-creds-password
  namespace: default
type: Opaque
stringData:
  username: "virtrigaud"
  password: "REDACTED"
  known_hosts: |
    kvm-host.example.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIREPLACE_WITH_HOST_KEY
