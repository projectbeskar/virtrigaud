# Complete Proxmox VE Provider Example
# This example demonstrates all major features of the Proxmox provider
#
# ⚠️  IMPORTANT: Requires Active Proxmox VE Server
# The Proxmox provider needs environment variables to connect to a real Proxmox VE server.
# See docs/providers/proxmox.md for deployment configuration examples.

---
# Secret for Proxmox VE API credentials
apiVersion: v1
kind: Secret
metadata:
  name: proxmox-credentials
  namespace: default
type: Opaque
stringData:
  # Use API token authentication (recommended)
  token_id: "virtrigaud@pve!vrtg-token"
  token_secret: "xxxxxxxx-xxxx-4xxx-xxxx-xxxxxxxxxxxx"
  
  # Optional: CA certificate for self-signed Proxmox VE
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    # Your Proxmox VE CA certificate here
    -----END CERTIFICATE-----

---
# Provider configuration for Proxmox VE
apiVersion: infra.virtrigaud.io/v1beta1
kind: Provider
metadata:
  name: proxmox-prod
  namespace: default
spec:
  type: proxmox
  endpoint: https://pve.example.com:8006
  credentialSecretRef:
    name: proxmox-credentials
  runtime:
    mode: Remote
    image: "ghcr.io/projectbeskar/virtrigaud/provider-proxmox:v0.2.3"
    service:
      port: 9090

---
# Small VM class for development workloads
apiVersion: infra.virtrigaud.io/v1beta1
kind: VMClass
metadata:
  name: small
  namespace: virtrigaud-system
spec:
  cpu: 2
  memory: "4Gi"
  diskDefaults:
    size: "40Gi"
    storageClass: "local-lvm"  # Proxmox storage pool

---
# Medium VM class for production workloads
#
# A VMClass only sets root-disk defaults (spec.diskDefaults); additional
# disks are attached per VM (see the db-server-01 data disk below).
apiVersion: infra.virtrigaud.io/v1beta1
kind: VMClass
metadata:
  name: medium
  namespace: virtrigaud-system
spec:
  cpu: 4
  memory: "8Gi"
  diskDefaults:
    size: "80Gi"
    storageClass: "ssd-storage"

---
# Ubuntu 22.04 VM image/template
apiVersion: infra.virtrigaud.io/v1beta1
kind: VMImage
metadata:
  name: ubuntu-22
  namespace: virtrigaud-system
spec:
  source:
    proxmox:
      templateName: "ubuntu-22-template"  # Existing template in Proxmox VE
  metadata:
    description: "Ubuntu 22.04 LTS Cloud Image"

---
# CentOS Stream 9 image from an existing Proxmox template.
# Proxmox URL image import (source.http) is refused with InvalidSpec in this
# release (ADR-0009 D10; see docs/image-preparation.md#proxmox-image-sources).
# Import the cloud image on the PVE node yourself, e.g.:
#   qm create 9001 --name centos-stream-9 --memory 2048 --net0 virtio,bridge=vmbr0
#   qm importdisk 9001 CentOS-Stream-GenericCloud-9-latest.x86_64.qcow2 local-lvm
#   qm set 9001 --scsihw virtio-scsi-pci --scsi0 local-lvm:vm-9001-disk-0 --ide2 local-lvm:cloudinit
#   qm template 9001
apiVersion: infra.virtrigaud.io/v1beta1
kind: VMImage
metadata:
  name: centos-stream-9
  namespace: virtrigaud-system
spec:
  source:
    proxmox:
      templateID: 9001
  metadata:
    description: "CentOS Stream 9 Cloud Image"

---
# Basic network configuration
apiVersion: infra.virtrigaud.io/v1beta1
kind: VMNetworkAttachment
metadata:
  name: lan-network
  namespace: virtrigaud-system
spec:
  network:
    proxmox:
      bridge: "vmbr0"

---
# Multi-NIC network configuration with VLANs
#
# A VMNetworkAttachment describes one network. For several NICs, create one
# attachment per bridge/VLAN and list each in the VirtualMachine's
# spec.networks (see web-server-01). A fixed MAC address is per interface, so
# it is set there too (spec.networks[].macAddress).

# Primary LAN interface with static IP (vmbr0)
apiVersion: infra.virtrigaud.io/v1beta1
kind: VMNetworkAttachment
metadata:
  name: multi-nic-lan
  namespace: virtrigaud-system
spec:
  network:
    proxmox:
      bridge: "vmbr0"
  ipAllocation:
    type: Static
    staticConfig:
      address: "192.168.1.100/24"
      gateway: "192.168.1.1"
    dnsConfig:
      servers: ["8.8.8.8", "1.1.1.1"]

---
# DMZ interface on a VLAN (vmbr1)
apiVersion: infra.virtrigaud.io/v1beta1
kind: VMNetworkAttachment
metadata:
  name: multi-nic-dmz
  namespace: virtrigaud-system
spec:
  network:
    proxmox:
      bridge: "vmbr1"
      vlanTag: 100

---
# Management interface (vmbr2); MAC address is set per-VM, see web-server-01
apiVersion: infra.virtrigaud.io/v1beta1
kind: VMNetworkAttachment
metadata:
  name: multi-nic-mgmt
  namespace: virtrigaud-system
spec:
  network:
    proxmox:
      bridge: "vmbr2"

---
# Simple development VM
apiVersion: infra.virtrigaud.io/v1beta1
kind: VirtualMachine
metadata:
  name: dev-vm-01
  namespace: virtrigaud-system
spec:
  providerRef:
    name: proxmox-prod
  classRef:
    name: small
  imageRef:
    name: ubuntu-22
  networks:
    - name: lan
      networkRef:
        name: lan-network
  powerState: "On"
  userData:
    cloudInit:
      inline: |
        #cloud-config
        hostname: dev-vm-01
        users:
          - name: ubuntu
            sudo: ALL=(ALL) NOPASSWD:ALL
            ssh_authorized_keys:
              - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI... dev@example.com"
        packages:
          - curl
          - git
          - docker.io
        runcmd:
          - systemctl enable docker
          - systemctl start docker
          - usermod -aG docker ubuntu

---
# Production web server with multi-NIC and snapshots
apiVersion: infra.virtrigaud.io/v1beta1
kind: VirtualMachine
metadata:
  name: web-server-01
  namespace: virtrigaud-system
  labels:
    environment: production
    tier: frontend
spec:
  providerRef:
    name: proxmox-prod
  classRef:
    name: medium
  imageRef:
    name: ubuntu-22
  networks:
    - name: lan
      networkRef:
        name: multi-nic-lan
    - name: dmz
      networkRef:
        name: multi-nic-dmz
    - name: mgmt
      networkRef:
        name: multi-nic-mgmt
      macAddress: "02:00:00:aa:bb:cc"
  powerState: "On"
  userData:
    cloudInit:
      inline: |
        #cloud-config
        hostname: web-server-01
        users:
          - name: webadmin
            sudo: ALL=(ALL) NOPASSWD:ALL
            ssh_authorized_keys:
              - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI... admin@example.com"
        packages:
          - nginx
          - certbot
          - python3-certbot-nginx
        runcmd:
          - systemctl enable nginx
          - systemctl start nginx
          - ufw allow 'Nginx Full'
          - ufw enable

---
# VM Snapshot for the web server
apiVersion: infra.virtrigaud.io/v1beta1
kind: VMSnapshot
metadata:
  name: web-server-01-baseline
  namespace: virtrigaud-system
spec:
  vmRef:
    name: web-server-01
  snapshotConfig:
    description: "Baseline snapshot after initial setup"
    includeMemory: false  # Faster crash-consistent snapshot

---
# Database server with high-performance storage
apiVersion: infra.virtrigaud.io/v1beta1
kind: VirtualMachine
metadata:
  name: db-server-01
  namespace: virtrigaud-system
  labels:
    environment: production
    tier: database
spec:
  providerRef:
    name: proxmox-prod
  classRef:
    name: medium
  imageRef:
    name: ubuntu-22
  networks:
    - name: lan
      networkRef:
        name: lan-network
  disks:
    - name: data
      sizeGiB: 100
      storageClass: "nvme-storage"  # High-performance pool for database storage
  powerState: "On"
  userData:
    cloudInit:
      inline: |
        #cloud-config
        hostname: db-server-01
        users:
          - name: dbadmin
            sudo: ALL=(ALL) NOPASSWD:ALL
            ssh_authorized_keys:
              - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI... dba@example.com"
        packages:
          - postgresql-14
          - postgresql-contrib
          - redis-server
        runcmd:
          - systemctl enable postgresql
          - systemctl start postgresql
          - systemctl enable redis-server
          - systemctl start redis-server

---
# Memory snapshot for database (before maintenance)
apiVersion: infra.virtrigaud.io/v1beta1
kind: VMSnapshot
metadata:
  name: db-server-01-pre-maintenance
  namespace: virtrigaud-system
spec:
  vmRef:
    name: db-server-01
  snapshotConfig:
    description: "Before database maintenance window"
    includeMemory: true  # Include memory for consistent state

---
# Test VM with CentOS Stream 9 (cloned from template 9001)
apiVersion: infra.virtrigaud.io/v1beta1
kind: VirtualMachine
metadata:
  name: test-centos-vm
  namespace: virtrigaud-system
  labels:
    environment: testing
spec:
  providerRef:
    name: proxmox-prod
  classRef:
    name: small
  imageRef:
    name: centos-stream-9  # Full clone of the existing template (no import)
  networks:
    - name: lan
      networkRef:
        name: lan-network
  powerState: "On"
  userData:
    cloudInit:
      inline: |
        #cloud-config
        hostname: test-centos-vm
        users:
          - name: centos
            sudo: ALL=(ALL) NOPASSWD:ALL
            ssh_authorized_keys:
              - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI... test@example.com"
        packages:
          - epel-release
          - htop
          - tmux
