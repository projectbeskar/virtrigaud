# Power-state examples: powerState OffGraceful vs Off.
#
# OffGraceful asks the guest OS to shut itself down; Off is a hard power-off.
# What the providers do for OffGraceful (internal/providers/*; the manager sends
# a fixed 60 s graceful timeout, internal/transport/grpc/client.go):
#   - vSphere : shutdown through VMware Tools (open-vm-tools must run in the
#               guest); a hard power-off if Tools is not running, the request
#               fails, or the VM is still on after the 60 s.
#   - Proxmox : PVE shutdown with a 60 s timeout and forceStop, so PVE powers the
#               VM off hard when the guest has not stopped by then.
#   - Libvirt : `virsh shutdown`; the domain is force-stopped only if that
#               command itself fails.
#
# spec.lifecycle (preStop, postStart, gracefulShutdownTimeout) is accepted by the
# API but nothing reads it: no hook runs and the 60 s above is not configurable.
# Stop application services from inside the guest instead (for example a systemd
# unit that runs on shutdown).

# Cross-namespace references: the VirtualMachines below live in `default` and
# reference a Provider, VMClass and VMImage in `virtrigaud-system`. Each of
# those objects must share itself with `default` via
# spec.consumerNamespaceSelector, or the VMs report Ready=False /
# ConsumerNotAllowed and nothing is created. On each of them (none is defined
# here), add for example:
#   consumerNamespaceSelector:
#     matchLabels:
#       kubernetes.io/metadata.name: default
# See docs/cross-namespace-references.md.

apiVersion: infra.virtrigaud.io/v1beta1
kind: VirtualMachine
metadata:
  name: graceful-shutdown-example
  namespace: default
spec:
  # Use graceful shutdown power state
  powerState: "OffGraceful"
  
  providerRef:
    name: vsphere-provider
    namespace: virtrigaud-system
  
  classRef:
    name: small-vm
    namespace: virtrigaud-system
  
  imageRef:
    name: ubuntu-22-04
    namespace: virtrigaud-system
  
  networks:
    - name: default-network
  
---
apiVersion: infra.virtrigaud.io/v1beta1
kind: VirtualMachine
metadata:
  name: regular-shutdown-example
  namespace: default
spec:
  # Regular hard shutdown
  powerState: "Off"
  
  providerRef:
    name: vsphere-provider
    namespace: virtrigaud-system
  
  classRef:
    name: small-vm
    namespace: virtrigaud-system
  
  imageRef:
    name: ubuntu-22-04
    namespace: virtrigaud-system
  
  networks:
    - name: default-network
