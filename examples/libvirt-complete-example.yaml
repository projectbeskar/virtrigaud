# Complete LibVirt/KVM Provider Example
# This example demonstrates VM creation using the LibVirt provider
#
# NOTE: Requires SSH access to a libvirt/KVM host
# The libvirt provider runs in a pod and connects to the host over SSH
# (qemu+ssh://). It runs virsh and qemu-img on the host, so the SSH user must be
# able to manage libvirt there. See docs/libvirt-domain-ownership.md ("Staging on
# the host") and docs/clustered-provider-inventory.md#host-prerequisites.
#
# ⚠️  SCHEMA UPDATE: This example has been updated to match the current v1beta1 CRD schema.
# Key changes: endpoint format, memory/disk sizes use resource.Quantity, 
# nested structure for source/network configs, and proper field naming.

# First, create the credentials secret
apiVersion: v1
kind: Secret
metadata:
  name: libvirt-creds
  namespace: default
type: Opaque
stringData:
  username: "virtrigaud"
  ssh-privatekey: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    REDACTED
    -----END OPENSSH PRIVATE KEY-----
  # The host's public key, in known_hosts format (for example `ssh-keyscan -t ed25519
  # kvm-host.example.com`, checked against the host's own fingerprint). Required:
  # the provider does not trust a host key on first use (ADR-0004).
  known_hosts: |
    kvm-host.example.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIREPLACE_WITH_HOST_KEY

---
# Define the Libvirt provider
apiVersion: infra.virtrigaud.io/v1beta1
kind: Provider
metadata:
  name: libvirt-local
  namespace: default
spec:
  type: libvirt
  endpoint: qemu+ssh://virtrigaud@kvm-host.example.com/system
  credentialSecretRef:
    name: libvirt-creds
  defaults:
    cluster: default
  rateLimit:
    qps: 5
    burst: 10
  runtime:
    mode: Remote
    image: "ghcr.io/projectbeskar/virtrigaud/provider-libvirt:v0.4.1"
    service:
      port: 9090
      # A Provider with no tls block is not deployed (TLSConfigured=False, reason
      # TLSBlockMissing). The Secret holds tls.crt, tls.key and ca.crt:
      #   kubectl create secret generic libvirt-local-tls --from-file=tls.crt --from-file=tls.key --from-file=ca.crt
      # For a plaintext lab only, use `enabled: false` and drop secretRef.
      tls:
        enabled: true
        secretRef:
          name: libvirt-local-tls
    # Directories a VMImage `source.libvirt.path` may point into (image files
    # must sit DIRECTLY in one of them; the path is resolved on the host, so
    # symlinks cannot escape). Comma- or colon-separated; the default when unset
    # is /var/lib/libvirt/images. List the pool directory ImagePrepare writes
    # into too if you use URL-sourced images. See docs/image-preparation.md.
    #
    # Host directory VMs' cloud-init seeds (user-data, which may carry secrets)
    # are built in, private. It must exist on every libvirt host, owned by the
    # provider's SSH user, mode 0711 (creates are refused otherwise):
    #   install -d -m 0711 -o <ssh user> -g <ssh user> /var/lib/libvirt/virtrigaud-seeds
    # The default when unset is /var/lib/libvirt/virtrigaud-seeds. See
    # docs/libvirt-domain-ownership.md#cloud-init-seed-directory.
    # env:
    #   - name: VIRTRIGAUD_LIBVIRT_IMAGE_DIRS
    #     value: "/var/lib/libvirt/images,/srv/golden-images"
    #   - name: VIRTRIGAUD_LIBVIRT_SEED_DIR
    #     value: "/var/lib/libvirt/virtrigaud-seeds"

---
# Define a VM class for KVM
apiVersion: infra.virtrigaud.io/v1beta1
kind: VMClass
metadata:
  name: kvm-small
  namespace: default
spec:
  cpu: 2
  memory: "2Gi"  # Uses Kubernetes resource.Quantity format
  firmware: BIOS  # Can be BIOS or UEFI
  diskDefaults:
    type: thin
    size: "20Gi"  # Uses Kubernetes resource.Quantity format
  guestToolsPolicy: install
  extraConfig:
    "autostart": "false"

---
# Define the VM image for Libvirt
apiVersion: infra.virtrigaud.io/v1beta1
kind: VMImage
metadata:
  name: ubuntu-20-kvm
  namespace: default
spec:
  source:
    libvirt:
      # Absolute path of a base image on the libvirt host. It must resolve to a
      # regular, self-contained image file directly inside an allowed image
      # directory (VIRTRIGAUD_LIBVIRT_IMAGE_DIRS on the provider, default
      # /var/lib/libvirt/images), must not be a disk of any existing VM, and
      # must not use a VirtRigaud-reserved name (*-disk.qcow2,
      # *-migrated.qcow2, dotfiles). It is copied into each VM's own disk.
      path: "/var/lib/libvirt/images/ubuntu-20.04-cloudimg.qcow2"
      format: qcow2
      # Alternative: download from URL
      # url: "https://cloud-images.ubuntu.com/focal/current/focal-server-cloudimg-amd64.img"
      # checksum: "abcd1234..."
      # checksumType: sha256
  prepare:
    onMissing: Fail  # Options: Import, Fail, Wait (previously importIfMissing)

---
# Define network attachment for Libvirt
apiVersion: infra.virtrigaud.io/v1beta1
kind: VMNetworkAttachment
metadata:
  name: kvm-default-network
  namespace: default
spec:
  network:
    type: bridged
    libvirt:
      networkName: "default"  # Use Libvirt default network
      model: virtio           # Network device model
  ipAllocation:
    type: DHCP

---
# Create the virtual machine
apiVersion: infra.virtrigaud.io/v1beta1
kind: VirtualMachine
metadata:
  name: ubuntu-kvm-vm
  namespace: default
spec:
  providerRef:
    name: libvirt-local
  classRef:
    name: kvm-small
  imageRef:
    name: ubuntu-20-kvm
  networks:
    - name: kvm-default-network
      networkRef:
        name: kvm-default-network
      # IP allocation handled by VMNetworkAttachment
  disks:
    - name: extra-storage
      sizeGiB: 50
      type: thin
  powerState: "On"  # Quote to ensure string type
  userData:
    cloudInit:
      inline: |
        #cloud-config
        hostname: ubuntu-kvm-vm
        fqdn: ubuntu-kvm-vm.local
        
        users:
          - name: ubuntu
            sudo: ALL=(ALL) NOPASSWD:ALL
            shell: /bin/bash
            lock_passwd: false
            passwd: $6$rounds=4096$saltysalt$hash... # Set your password hash
            ssh_authorized_keys:
              - ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAAB... # Add your SSH key here
              
        packages:
          - qemu-guest-agent
          - curl
          - wget
          - htop
          - nginx
          
        runcmd:
          - systemctl enable qemu-guest-agent
          - systemctl start qemu-guest-agent
          - systemctl enable nginx
          - systemctl start nginx
          - echo "<h1>Hello from KVM!</h1>" > /var/www/html/index.html
          - ufw allow 22/tcp
          - ufw allow 80/tcp
          - ufw --force enable
          
        final_message: "KVM VM is ready! SSH: ssh ubuntu@<ip>"
        
  tags:
    - environment:test
    - hypervisor:kvm
    - managed-by:virtrigaud
