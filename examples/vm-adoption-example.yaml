# VM Adoption Examples
#
# VMAdoption is a CONTROLLER built into the manager, not a CRD.
# Adoption is triggered by annotations on the Provider CR.
# The Provider spec uses the v1beta1 schema: type, endpoint,
# credentialSecretRef, and runtime — NOT nested provider-specific blocks.
#
# The old spec fields (remote: true, vsphere.server, libvirt.uri,
# proxmox.server, credentials.secretRef) do NOT exist in v0.3.6.

---
# Example 1: vSphere Provider with VM Adoption enabled
#
# Adoption is THE way to bring a pre-existing vSphere VM under management.
# Creating a VirtualMachine whose name matches an existing VM does NOT bind to
# it: the vSphere provider only binds a VM in the target folder whose
# ExtraConfig owner stamp (virtrigaud.owner.uid) records that VirtualMachine's
# own UID, and otherwise fails the create with a Ready=False / ProviderConflict
# condition. See docs/vm-ownership.md.
apiVersion: infra.virtrigaud.io/v1beta1
kind: Provider
metadata:
  name: vsphere-prod
  namespace: default
  annotations:
    virtrigaud.io/adopt-vms: "true"
spec:
  type: vsphere
  endpoint: "https://vcenter.example.com:443"
  credentialSecretRef:
    name: vsphere-prod-credentials
    namespace: default
  runtime:
    image: "ghcr.io/projectbeskar/virtrigaud/provider-vsphere:v0.3.6"
    service:
      port: 9443
  defaults:
    datacenter: Production
    datastore: datastore1
    cluster: cluster1

---
# Example 2: vSphere Provider — adopt only VMs matching a name pattern
# The annotation value is passed to the VMAdoption controller as a filter hint.
apiVersion: infra.virtrigaud.io/v1beta1
kind: Provider
metadata:
  name: vsphere-prod-filtered
  namespace: default
  annotations:
    virtrigaud.io/adopt-vms: "true"
    virtrigaud.io/adopt-filter: '{"namePattern": "^prod-.*"}'
spec:
  type: vsphere
  endpoint: "https://vcenter.example.com:443"
  credentialSecretRef:
    name: vsphere-prod-credentials
    namespace: default
  runtime:
    image: "ghcr.io/projectbeskar/virtrigaud/provider-vsphere:v0.3.6"
    service:
      port: 9443

---
# Example 3: Libvirt Provider with VM Adoption enabled
#
# Adoption is THE way to bring a pre-existing libvirt domain under management.
# Creating a VirtualMachine whose name matches an existing domain does NOT bind
# to it: the libvirt provider only binds a domain stamped with that
# VirtualMachine's own UID, and otherwise fails the create with a
# Ready=False / ProviderConflict condition. See docs/libvirt-domain-ownership.md
# and docs/vm-ownership.md.
#
# VirtualMachines created by VirtRigaud get libvirt domains named
# "<namespace>.<name>" (e.g. "team-a.app-web"); the filter below matches domain
# names, so it does not match those. Adoption also never adopts a domain whose
# VirtRigaud owner stamp names a VirtualMachine that still exists.
apiVersion: infra.virtrigaud.io/v1beta1
kind: Provider
metadata:
  name: libvirt-kvm-prod
  namespace: default
  annotations:
    virtrigaud.io/adopt-vms: "true"
    virtrigaud.io/adopt-filter: '{"namePattern": "^app-.*"}'
spec:
  type: libvirt
  endpoint: "qemu+ssh://kvm-host.example.com/system"
  credentialSecretRef:
    name: libvirt-prod-credentials
    namespace: default
  runtime:
    image: "ghcr.io/projectbeskar/virtrigaud/provider-libvirt:v0.3.6"
    service:
      port: 9443

---
# Example 4: Proxmox Provider with VM Adoption enabled
apiVersion: infra.virtrigaud.io/v1beta1
kind: Provider
metadata:
  name: proxmox-prod
  namespace: default
  annotations:
    virtrigaud.io/adopt-vms: "true"
spec:
  type: proxmox
  endpoint: "https://proxmox.example.com:8006"
  credentialSecretRef:
    name: proxmox-prod-credentials
    namespace: default
  runtime:
    image: "ghcr.io/projectbeskar/virtrigaud/provider-proxmox:v0.3.6"
    service:
      port: 9443
