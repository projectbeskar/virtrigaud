# NetworkPolicy for a Proxmox VE Provider named `proxmox-prod` (see
# ../proxmox-complete-example.yaml).
# Restricts network access to only required endpoints. The pods of a Provider CR
# carry app.kubernetes.io/name=virtrigaud-provider and
# app.kubernetes.io/instance=<Provider name>; the gRPC port is
# spec.runtime.service.port (default 9443), metrics are on 8080.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: provider-proxmox-netpol
  namespace: virtrigaud-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: virtrigaud-provider
      app.kubernetes.io/instance: proxmox-prod
  policyTypes:
  - Ingress
  - Egress
  
  # Ingress: Allow connections from the manager
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: virtrigaud
          app.kubernetes.io/component: manager
    ports:
    - protocol: TCP
      port: 9443  # gRPC provider port (spec.runtime.service.port)
  # Metrics and health probes (8080); narrow `from` to your monitoring namespace
  - ports:
    - protocol: TCP
      port: 8080

  # Egress: Restrict to essential endpoints only
  egress:
  # DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  
  # Proxmox VE API endpoints
  - to:
    # Allow access to Proxmox VE cluster IPs
    # Replace with your actual Proxmox VE IP ranges
    - ipBlock:
        cidr: 192.168.1.0/24  # Proxmox VE network
        except:
        - 192.168.1.0/32      # Network address
        - 192.168.1.255/32    # Broadcast address
    ports:
    - protocol: TCP
      port: 8006  # Proxmox VE API port
    - protocol: TCP
      port: 22    # SSH to the PVE node (only for VMMigration)

  # The provider needs no Kubernetes API access, so there is no rule for it.

---
# Additional NetworkPolicy for development with fake server
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: provider-proxmox-dev-netpol
  namespace: virtrigaud-system
  labels:
    environment: development
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: virtrigaud-provider
      app.kubernetes.io/instance: proxmox-dev
  policyTypes:
  - Egress
  
  egress:
  # Allow all egress for development (less restrictive)
  - to: []
    ports:
    - protocol: TCP
      port: 8006  # Fake PVE server
    - protocol: UDP
      port: 53    # DNS
    - protocol: TCP
      port: 53    # DNS over TCP
    - protocol: TCP
      port: 443   # HTTPS for image downloads

---
# ServiceMonitor for Prometheus scraping (if metrics enabled)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: provider-proxmox-metrics
  namespace: virtrigaud-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: virtrigaud-provider
      app.kubernetes.io/instance: proxmox-prod
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
