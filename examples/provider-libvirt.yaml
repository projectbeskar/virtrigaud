# LibVirt Provider Example  
# This example demonstrates Remote provider configuration for LibVirt/KVM
#
# ⚠️  IMPORTANT: Requires LibVirt Host Access
# The LibVirt provider needs access to a LibVirt daemon (qemu:///system or remote)
# See docs/providers/libvirt.md for setup instructions and configuration details.

apiVersion: infra.virtrigaud.io/v1beta1
kind: Provider
metadata:
  name: libvirt-local
  namespace: default
spec:
  type: libvirt
  endpoint: qemu+tcp://libvirt.example.com/system
  credentialSecretRef:
    name: libvirt-creds
  runtime:
    mode: Remote
    image: "ghcr.io/projectbeskar/virtrigaud/provider-libvirt:v0.4.0"
    service:
      port: 9090
      # A Provider with no tls block is not deployed (TLSConfigured=False, reason
      # TLSBlockMissing). The Secret holds tls.crt, tls.key and ca.crt:
      #   kubectl create secret generic libvirt-local-tls --from-file=tls.crt --from-file=tls.key --from-file=ca.crt
      # For a plaintext lab only, use `enabled: false` and drop secretRef.
      tls:
        enabled: true
        secretRef:
          name: libvirt-local-tls
