# LibVirt Provider Example  
# This example demonstrates Remote provider configuration for LibVirt/KVM
#
# ⚠️  IMPORTANT: Requires SSH access to a libvirt/KVM host
# The provider connects over SSH (qemu+ssh://) and runs virsh and qemu-img on the
# host. The credentialSecretRef Secret needs `username`, `ssh-privatekey` (or
# `password`) and `known_hosts`: the provider verifies the host key and does not
# trust on first use (ADR-0004). See secrets/libvirt-creds.yaml.

apiVersion: infra.virtrigaud.io/v1beta1
kind: Provider
metadata:
  name: libvirt-local
  namespace: default
spec:
  type: libvirt
  endpoint: qemu+ssh://virtrigaud@libvirt.example.com/system
  credentialSecretRef:
    name: libvirt-creds
  runtime:
    mode: Remote
    image: "ghcr.io/projectbeskar/virtrigaud/provider-libvirt:v0.4.0"
    service:
      port: 9090
      # A Provider with no tls block is not deployed (TLSConfigured=False, reason
      # TLSBlockMissing). The Secret holds tls.crt, tls.key and ca.crt:
      #   kubectl create secret generic libvirt-local-tls --from-file=tls.crt --from-file=tls.key --from-file=ca.crt
      # For a plaintext lab only, use `enabled: false` and drop secretRef.
      tls:
        enabled: true
        secretRef:
          name: libvirt-local-tls
