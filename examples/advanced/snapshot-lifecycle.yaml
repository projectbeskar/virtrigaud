# Snapshot Lifecycle Management Example
# This demonstrates the complete snapshot lifecycle:
# 1. Create snapshots for backup/rollback
# 2. Revert to a previous snapshot (power off, set spec.snapshot.revertToRef)
# 3. Clean up old snapshots

---
# Create a backup snapshot before maintenance
apiVersion: infra.virtrigaud.io/v1beta1
kind: VMSnapshot
metadata:
  name: web-server-01-maintenance-backup
  namespace: default
spec:
  vmRef:
    name: web-server-01
  snapshotConfig:
    name: "maintenance-backup"
    includeMemory: true  # Include memory for faster rollback
    description: "Backup before scheduled maintenance window"
  retentionPolicy:
    maxAge: "720h"  # Keep for 30 days
    deleteOnVMDelete: true

---
# Create a snapshot before applying updates
apiVersion: infra.virtrigaud.io/v1beta1
kind: VMSnapshot
metadata:
  name: web-server-01-pre-update
  namespace: default
spec:
  vmRef:
    name: web-server-01
  snapshotConfig:
    name: "pre-system-update"
    includeMemory: false  # Disk-only snapshot for storage efficiency
    description: "Snapshot before system package updates"
  retentionPolicy:
    maxAge: "168h"
    deleteOnVMDelete: true

---
# Weekly backup snapshot (would be created by a CronJob)
apiVersion: infra.virtrigaud.io/v1beta1
kind: VMSnapshot
metadata:
  name: web-server-01-weekly-backup
  namespace: default
  labels:
    backup-type: weekly
    automated: "true"
spec:
  vmRef:
    name: web-server-01
  snapshotConfig:
    # spec.snapshotConfig.name only accepts a literal string (no shell
    # expansion); a real CronJob must render a fresh name per run (e.g. with
    # envsubst) before kubectl apply, rather than embedding it in this field.
    name: "weekly-backup"
    includeMemory: false  # Disk-only for long-term storage
    description: "Automated weekly backup snapshot"
  retentionPolicy:
    maxAge: "2160h"  # Keep weekly backups for 3 months
    deleteOnVMDelete: false  # Keep backups even if VM is deleted

---
# To revert web-server-01 to one of the snapshots above
# (docs/vm-snapshot-revert.md):
#
# 1. Power the VM off. VirtRigaud never powers a VM off for a revert: until the
#    provider reports the VM Off AND spec.powerState is Off (or OffGraceful),
#    nothing is sent and the VM shows SnapshotReverted=False/WaitingForPowerOff.
#
#      kubectl patch vm web-server-01 --type merge -p '{"spec":{"powerState":"Off"}}'
#
# 2. Name the VMSnapshot. It must be Ready and taken of this VM (its
#    spec.vmRef and status.vmUID), through the VM's Provider:
#
#      kubectl patch vm web-server-01 --type merge \
#        -p '{"spec":{"snapshot":{"revertToRef":{"name":"web-server-01-pre-update"}}}}'
#
#    The same, in the VM's manifest:
#
#      apiVersion: infra.virtrigaud.io/v1beta1
#      kind: VirtualMachine
#      metadata:
#        name: web-server-01
#        namespace: default
#      spec:
#        # ...the rest of the VM's spec...
#        powerState: "Off"
#        snapshot:
#          revertToRef:
#            name: web-server-01-pre-update
#
# 3. Watch the outcome: status.snapshotRevert.phase goes Reverting, then
#    Succeeded (SnapshotReverted=True, reason Reverted) or Failed
#    (SnapshotReverted=False, reason RevertFailed). Until it succeeds, Ready
#    is False with the same reason. Events: SnapshotRevertStarted,
#    SnapshotRevertSucceeded, SnapshotRevertFailed.
#
#      kubectl get vm web-server-01 -o jsonpath='{.status.snapshotRevert.phase}{"\n"}'
#
# 4. Power the VM on again if you want it running; the revert does not.
#    (Reverting to a snapshot taken with memory, like
#    web-server-01-maintenance-backup, can leave the VM running; a VM whose
#    spec still says Off is then powered off again.)
#
#      kubectl patch vm web-server-01 --type merge -p '{"spec":{"powerState":"On"}}'
#
# The revert is sent at most once per request: leaving revertToRef set (or
# re-applying the same manifest) does nothing more. To revert to the same
# snapshot again, remove the field, wait for status.snapshotRevert to be
# cleared, then set it again; naming another VMSnapshot is a new request.
#
#      kubectl patch vm web-server-01 --type json \
#        -p '[{"op":"remove","path":"/spec/snapshot/revertToRef"}]'

---
# Example CronJob for automated snapshot cleanup
# (This would be deployed separately)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: snapshot-cleanup
  namespace: default
spec:
  schedule: "0 2 * * 0"  # Weekly on Sunday at 2 AM
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: virtrigaud-snapshot-cleanup
          containers:
          - name: cleanup
            image: bitnami/kubectl:latest
            command:
            - /bin/sh
            - -c
            - |
              # Delete snapshots older than retention policy
              # In practice, this would be handled by the controller
              echo "Cleanup would run here"
              
              # Delete old automated snapshots
              kubectl delete vmsnapshots -l automated=true \
                --field-selector='metadata.creationTimestamp<$(date -d "90 days ago" -Iso-8601)'
          restartPolicy: OnFailure

---
# RBAC for snapshot cleanup job
apiVersion: v1
kind: ServiceAccount
metadata:
  name: virtrigaud-snapshot-cleanup
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: snapshot-cleanup
  namespace: default
rules:
- apiGroups: ["infra.virtrigaud.io"]
  resources: ["vmsnapshots"]
  verbs: ["get", "list", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: snapshot-cleanup
  namespace: default
subjects:
- kind: ServiceAccount
  name: virtrigaud-snapshot-cleanup
  namespace: default
roleRef:
  kind: Role
  name: snapshot-cleanup
  apiGroup: rbac.authorization.k8s.io
