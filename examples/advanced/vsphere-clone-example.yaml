# vSphere VM Cloning Example
#
# NOTE: VirtualMachine has no cloneType field -- there is no full/linked
# knob on the VM spec. Every VM created below with an imageRef pointing at a
# vSphere template is created by cloning that template under the hood; the
# choice of full vs. linked disk provisioning is not exposed there.
#
# Explicit clone-type control (FullClone/LinkedClone) exists only on the
# separate VMClone resource, and even there only for cloning an EXISTING
# VirtualMachine (source.vmRef) -- cloning directly from a template or
# VMImage is declared in the VMClone schema but not yet implemented (see
# examples/vmclone-basic.yaml for the current MVP scope). LinkedClone
# additionally requires the provider to report that capability.
#
# Features demonstrated:
# - Creating multiple VMs from the same vSphere template image
# - Cloning an existing VM into a new one via VMClone (Example 4)

---
# Provider configuration
apiVersion: infra.virtrigaud.io/v1beta1
kind: Provider
metadata:
  name: vsphere-prod
  namespace: default
spec:
  type: vsphere
  endpoint: https://vcenter.example.com/sdk
  credentialSecretRef:
    name: vsphere-credentials
  runtime:
    mode: Remote
    image: "ghcr.io/projectbeskar/virtrigaud/provider-vsphere:v0.2.3"
    service:
      port: 9090
  defaults:
    datastore: "datastore1"
    cluster: "cluster1"
    folder: "virtrigaud-vms"

---
# VMClass for cloned VMs
apiVersion: infra.virtrigaud.io/v1beta1
kind: VMClass
metadata:
  name: web-server
  namespace: default
spec:
  cpu: 4
  memory: "8Gi"
  diskDefaults:
    type: thin
    size: "100Gi"

---
# VMImage referencing source template
apiVersion: infra.virtrigaud.io/v1beta1
kind: VMImage
metadata:
  name: ubuntu-22-template
  namespace: default
spec:
  source:
    vsphere:
      templateName: "ubuntu-22.04-server-template"

---
# VMNetworkAttachment
apiVersion: infra.virtrigaud.io/v1beta1
kind: VMNetworkAttachment
metadata:
  name: production-network
  namespace: default
spec:
  network:
    vsphere:
      portgroup: "VM Network"

---
# Example 1: Full Clone for Production
# Creates an independent copy with separate storage
# Use for: Production workloads, long-lived VMs
apiVersion: infra.virtrigaud.io/v1beta1
kind: VirtualMachine
metadata:
  name: web-prod-01
  namespace: default
  annotations:
    description: "Production web server - full clone"
spec:
  providerRef:
    name: vsphere-prod
  classRef:
    name: web-server
  imageRef:
    name: ubuntu-22-template
  networks:
    - name: production-network
      networkRef:
        name: production-network

  powerState: "On"

  # Cloud-init configuration
  userData:
    cloudInit:
      inline: |
        #cloud-config
        hostname: web-prod-01

        users:
          - name: ubuntu
            sudo: ALL=(ALL) NOPASSWD:ALL
            groups: users, admin
            shell: /bin/bash
            ssh_authorized_keys:
              - ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC...

        packages:
          - nginx
          - docker.io
          - open-vm-tools

        runcmd:
          - systemctl enable nginx
          - systemctl start nginx
          - echo "Production Web Server" > /var/www/html/index.html

---
# Example 2: "Development" copy of the same template
# See the header note: there is no linked-clone option here, this is the
# same full clone-from-template as Example 1, just with different
# customization. For real linked clones, use VMClone against an existing VM.
apiVersion: infra.virtrigaud.io/v1beta1
kind: VirtualMachine
metadata:
  name: web-dev-01
  namespace: default
  annotations:
    description: "Development web server"
spec:
  providerRef:
    name: vsphere-prod
  classRef:
    name: web-server
  imageRef:
    name: ubuntu-22-template
  networks:
    - name: production-network
      networkRef:
        name: production-network

  powerState: "On"

  userData:
    cloudInit:
      inline: |
        #cloud-config
        hostname: web-dev-01

        users:
          - name: developer
            sudo: ALL=(ALL) NOPASSWD:ALL
            groups: users, admin
            shell: /bin/bash
            ssh_authorized_keys:
              - ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC...

        packages:
          - nginx
          - nodejs
          - npm
          - open-vm-tools

        runcmd:
          - systemctl enable nginx
          - systemctl start nginx
          - echo "Development Environment" > /var/www/html/index.html

---
# Example 3: Rapid Test Environment Provisioning
# Create multiple VMs from the same template for parallel testing
apiVersion: infra.virtrigaud.io/v1beta1
kind: VirtualMachine
metadata:
  name: test-env-01
  namespace: default
  labels:
    environment: test
    purpose: automated-testing
spec:
  providerRef:
    name: vsphere-prod
  classRef:
    name: web-server
  imageRef:
    name: ubuntu-22-template
  networks:
    - name: production-network
      networkRef:
        name: production-network

  powerState: "On"

  userData:
    cloudInit:
      inline: |
        #cloud-config
        hostname: test-env-01
        users:
          - name: test-user
            sudo: ALL=(ALL) NOPASSWD:ALL
            shell: /bin/bash

---
apiVersion: infra.virtrigaud.io/v1beta1
kind: VirtualMachine
metadata:
  name: test-env-02
  namespace: default
  labels:
    environment: test
    purpose: automated-testing
spec:
  providerRef:
    name: vsphere-prod
  classRef:
    name: web-server
  imageRef:
    name: ubuntu-22-template
  networks:
    - name: production-network
      networkRef:
        name: production-network

  powerState: "On"

  userData:
    cloudInit:
      inline: |
        #cloud-config
        hostname: test-env-02
        users:
          - name: test-user
            sudo: ALL=(ALL) NOPASSWD:ALL
            shell: /bin/bash

---
# Example 4: Clone an Existing VM (not a template)
# This is the only case that is a real "clone" in the VMClone sense: it
# clones the already-provisioned web-prod-01 VirtualMachine (Example 1)
# rather than the shared template image. See examples/vmclone-basic.yaml
# for the full MVP scope and limitations.
apiVersion: infra.virtrigaud.io/v1beta1
kind: VMClone
metadata:
  name: web-prod-backup
  namespace: default
  annotations:
    description: "Backup of production server"
spec:
  # Reference an existing, already-provisioned VirtualMachine as the source
  source:
    vmRef:
      name: web-prod-01

  target:
    name: web-prod-backup
    classRef:
      name: web-server

  # Full clone for an independent backup, left powered off
  options:
    type: FullClone
    powerOn: false

---
# Usage Instructions:
#
# 1. Deploy the resources:
#    kubectl apply -f vsphere-clone-example.yaml
#
# 2. Monitor VM creation (Examples 1-3, created directly from the template):
#    kubectl get vm -w
#    kubectl describe vm web-prod-01
#
# 3. Check VM status:
#    kubectl get vm web-prod-01 -o jsonpath='{.status.phase}'
#
# 4. View VM details:
#    kubectl get vm web-dev-01 -o yaml
#
# 5. Monitor the VMClone (Example 4) and the VM it produces:
#    kubectl get vmclone web-prod-backup -w
#    kubectl get vm web-prod-backup -o yaml
#
# Clone Types (VMClone resource only -- see examples/vmclone-basic.yaml):
#
# FullClone (default):
# - Creation time: 5-15 minutes (depends on disk size)
# - Storage: Full disk space allocated
# - Independence: Completely independent from source
# - Best for: Production, long-lived VMs, backups
#
# LinkedClone:
# - Creation time: 1-3 minutes (much faster)
# - Storage: Only delta changes stored
# - Independence: Requires the parent VM to remain available
# - Requires the provider to report linked-clone support; on an unsupported
#   provider the VMClone fails with Phase=Failed
#
# Troubleshooting:
#
# If a VM or VMClone fails:
# 1. Check provider logs: kubectl logs deployment/virtrigaud-provider-vsphere
# 2. Verify the source template/VM exists: Check vCenter
# 3. Ensure sufficient storage: Check datastore capacity
# 4. For VMClone: kubectl describe vmclone <name> for Phase/Message
#
# Limitations:
# - VirtualMachine has no per-VM clone-type field; VMs created from a
#   template image are always independent clones under the hood.
# - VMClone currently only clones an existing VM (source.vmRef); cloning
#   directly from a template or VMImage is declared in the schema but not
#   yet implemented.
# - LinkedClone via VMClone requires the source VM to remain available and
#   the provider to support it.
