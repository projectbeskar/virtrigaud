# VM Reconfiguration Example
# This patch demonstrates how to modify a VM's resources after creation
# Apply this after the initial VM is running to trigger reconfiguration
#
# NOTE — what a reconfigure does on each provider (docs/reconfigure-results.md):
#   Libvirt: the change is written to the VM's persistent definition and, on a
#   running VM, applied live where libvirt allows it. A grow that needs CPU or
#   memory hot-add (the VM must have been created from a VMClass with
#   cpuHotAddEnabled / memoryHotAddEnabled), and any memory shrink on a running
#   VM, is "restart required": it takes effect at the next power cycle
#   (Reconfiguring=True, reason RestartRequired). The controller does not
#   power-cycle the VM for you.
#   Disks grow only (the VMClass disk size is a floor); a running VM's disk is
#   grown live and the filesystem inside the guest is grown on a best-effort basis.
#   vSphere: applied by one reconfigure task. A powered-on VM that cannot take
#   the change now (no CPU/memory hot-add, a disk on a shared SCSI bus, ...) is
#   refused before anything changes (Reconfiguring=False, reason
#   ResizePendingPowerOff); set spec.powerState: Off and it is applied.
#   Proxmox: applied through the PVE API; a CPU/memory change PVE keeps pending
#   because hot-plug is off is currently reported as applied.

---
# Upgrade web-server-01 resources.
# Apply with: kubectl patch vm web-server-01 --patch-file vm-reconfigure-patch.yaml --type merge
# A merge patch only needs spec.resources; providerRef, classRef and imageRef
# (unchanged from vm-reconfigure-and-snapshot.yaml) keep this file a complete,
# valid VirtualMachine as well.
apiVersion: infra.virtrigaud.io/v1beta1
kind: VirtualMachine
metadata:
  name: web-server-01
  namespace: default
spec:
  providerRef:
    name: vsphere-prod
  classRef:
    name: web-server-small
  imageRef:
    name: ubuntu-22-server

  # Increase CPU and memory
  resources:
    cpu: 4            # Upgrade from 2 to 4 CPUs
    memoryMiB: 8192    # Upgrade from 4096 MiB (4Gi) to 8192 MiB (8Gi)

  # Expand the data disk
  disks:
    - name: "data"
      sizeGiB: 100    # Expand from 50GB to 100GB
      type: "thin"
    # Add a new disk
    - name: "logs"
      sizeGiB: 20
      type: "thin"

# The controller detects any change between the VM's effective resources
# (this VMClass with spec.resources applied on top, field by field — an
# override outside the VMClass's own CPU/memory bounds is refused with
# Reconfiguring=False/ValidationError and never sent to the provider) and
# status.currentResources, then sends ONE Reconfigure request per provider
# reconcile:
# 1. The provider applies what it can online (see the Libvirt note above;
#    vSphere and Proxmox apply CPU/memory online when the guest OS and
#    hypervisor allow it).
# 2. Anything that cannot be applied online is written to the VM's offline
#    configuration instead and takes effect on its next power cycle — the
#    controller does NOT power the VM off and back on for you. The provider
#    logs a WARN when this happens; check it (or the guest's actual CPU/
#    memory) if you need the new size to take effect immediately.
# 3. status.currentResources, status.lastReconfigureTime and the
#    Reconfiguring condition are updated once the provider confirms the
#    request — never before, and never to a size that was not actually sent.
