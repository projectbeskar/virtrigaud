  namespace: default
spec:
  powerState: "On"
  
  providerRef:
    name: proxmox-provider
    namespace: virtrigaud-system
  
  classRef:
    name: xlarge-disk-class  # Should get 100GB disk (already working)
    namespace: virtrigaud-system
  
  imageRef:
    name: ubuntu-22-04-template
    namespace: virtrigaud-system
