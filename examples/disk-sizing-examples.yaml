---
# Cross-namespace references: the VirtualMachines below live in `default` and
# reference a Provider, VMClass and VMImage in `virtrigaud-system`. Each of
# those objects must share itself with `default` via
# spec.consumerNamespaceSelector (the VMClasses in this file do), or the VMs
# report Ready=False / ConsumerNotAllowed and nothing is created. For the
# Provider and VMImage (not defined here), add for example:
#   consumerNamespaceSelector:
#     matchLabels:
#       kubernetes.io/metadata.name: default
# See docs/cross-namespace-references.md.

# Example: disk sizes across providers
# A VM's root disk takes the size of its VMClass's spec.diskDefaults.size; extra
# disks are listed in the VirtualMachine's spec.disks[].sizeGiB.
#
# A Provider's owner can cap every disk created or grown through it with the
# annotation infra.virtrigaud.io/max-disk-size (for example "500Gi"); it can only
# lower the manager-wide --max-disk-size ceiling (Helm: manager.maxDiskSize). A VM whose
# disk is larger waits with Ready=False, reason DiskSizeExceedsLimit.

# VMClass with 50GB disk
apiVersion: infra.virtrigaud.io/v1beta1
kind: VMClass
metadata:
  name: large-disk-class
  namespace: virtrigaud-system
spec:
  # Referenced by VirtualMachines in `default`: share it with that namespace.
  consumerNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: default
  cpu: 2
  memory: 4Gi
  firmware: BIOS
  
  diskDefaults:
    type: thin
    size: 50Gi  # 50GiB root disk

---
# VMClass with 100GB disk
apiVersion: infra.virtrigaud.io/v1beta1
kind: VMClass
metadata:
  name: xlarge-disk-class
  namespace: virtrigaud-system
spec:
  # Referenced by VirtualMachines in `default`: share it with that namespace.
  consumerNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: default
  cpu: 4
  memory: 8Gi
  firmware: UEFI
  
  diskDefaults:
    type: thick
    size: 100Gi  # 100GB disk

---
# VMClass with small 30GB disk
apiVersion: infra.virtrigaud.io/v1beta1
kind: VMClass
metadata:
  name: small-disk-class
  namespace: virtrigaud-system
spec:
  # Referenced by VirtualMachines in `default`: share it with that namespace.
  consumerNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: default
  cpu: 1
  memory: 2Gi
  firmware: BIOS
  
  diskDefaults:
    type: thin
    size: 30Gi  # 30GB disk

---
# Test VM with 50GB disk (vSphere)
apiVersion: infra.virtrigaud.io/v1beta1
kind: VirtualMachine
metadata:
  name: test-vsphere-50gb
  namespace: default
spec:
  powerState: "On"
  
  providerRef:
    name: vsphere-provider
    namespace: virtrigaud-system
  
  classRef:
    name: large-disk-class  # Should get 50GB disk
    namespace: virtrigaud-system
  
  imageRef:
    name: ubuntu-22-04-template
    namespace: virtrigaud-system

---
# Test VM with 100GB disk (vSphere)
apiVersion: infra.virtrigaud.io/v1beta1
kind: VirtualMachine
metadata:
  name: test-vsphere-100gb
  namespace: default
spec:
  powerState: "On"
  
  providerRef:
    name: vsphere-provider
    namespace: virtrigaud-system
  
  classRef:
    name: xlarge-disk-class  # Should get 100GB disk
    namespace: virtrigaud-system
  
  imageRef:
    name: ubuntu-22-04-template
    namespace: virtrigaud-system

---
# Test VM with 30GB disk (LibVirt)
apiVersion: infra.virtrigaud.io/v1beta1
kind: VirtualMachine
metadata:
  name: test-libvirt-30gb
  namespace: default
spec:
  powerState: "On"
  
  providerRef:
    name: libvirt-provider
    namespace: virtrigaud-system
  
  classRef:
    name: small-disk-class  # Should get 30GB disk (not 20GB default)
    namespace: virtrigaud-system
  
  imageRef:
    name: ubuntu-22-04
    namespace: virtrigaud-system

---
# Test VM with 50GB disk (LibVirt)
apiVersion: infra.virtrigaud.io/v1beta1
kind: VirtualMachine
metadata:
  name: test-libvirt-50gb
  namespace: default
spec:
  powerState: "On"
  
  providerRef:
    name: libvirt-provider
    namespace: virtrigaud-system
  
  classRef:
    name: large-disk-class  # Should get 50GB disk (not 20GB default)
    namespace: virtrigaud-system
  
  imageRef:
    name: ubuntu-22-04
    namespace: virtrigaud-system

---
# Test VM with 100GB disk (Proxmox - should already work)
apiVersion: infra.virtrigaud.io/v1beta1
kind: VirtualMachine
metadata:
