syntax = "proto3";
package provider.v1;
option go_package = "github.com/projectbeskar/virtrigaud/proto/rpc/provider/v1;providerv1";

// Power operations enum
enum PowerOp {
  POWER_OP_UNSPECIFIED = 0;
  POWER_OP_ON = 1;
  POWER_OP_OFF = 2;
  POWER_OP_REBOOT = 3;
  POWER_OP_SHUTDOWN_GRACEFUL = 4;  // Graceful shutdown using guest tools
}

// Task reference for async operations
message TaskRef {
  string id = 1;
}

// Empty message for operations with no parameters
message Empty {}

// Validate provider connectivity and configuration
message ValidateRequest {}
message ValidateResponse {
  bool ok = 1;
  string message = 2;
}

// Create a new virtual machine
message CreateRequest {
  string name = 1;
  bytes user_data = 2; // Already rendered cloud-init/ignition data
  bytes meta_data = 9; // Cloud-init metadata (YAML format)

  // JSON-encoded provider-agnostic specifications
  string class_json = 3;     // VMClass
  string image_json = 4;     // VMImage
  string networks_json = 5;  // []NetworkAttachment
  string disks_json = 6;     // []DiskSpec
  string placement_json = 7; // Placement
  repeated string tags = 8;  // Tags

  // target_host_id names the specific host a clustered ("brain-in-operator")
  // provider must create this VM on (ADR-0007 P1, D4). It is the operator
  // scheduler's binding on the wire — an EXPLICIT field, deliberately NOT buried
  // in placement_json (which stays for external-orchestrator hints such as
  // vSphere cluster/datastore/folder). AGNOSTIC. Additive and backward-compatible:
  // single-host and thin-client providers ignore it, and never receive it; a
  // clustered provider REQUIRES it and rejects an empty value rather than
  // silently defaulting to some host (honesty-first, D9). The operator sets it
  // only when creating a VM whose Provider has topology: cluster.
  string target_host_id = 10;

  // owner identifies the Kubernetes object (the VirtualMachine) this create is
  // performed for. A provider that keys hypervisor VMs by a name that is NOT
  // unique across tenants (libvirt: the bare VirtualMachine name, no namespace)
  // stamps it onto the VM it creates and, when a VM of the requested name
  // already exists, treats the create as an idempotent success ONLY if that VM
  // carries this owner's uid — otherwise it fails closed with ALREADY_EXISTS
  // rather than silently binding to another tenant's VM. AGNOSTIC. Additive and
  // backward-compatible: providers that do not key by a shared name ignore it;
  // an unset owner (an older manager) never authorizes binding to an existing
  // VM. The operator sets it on every create from vm.UID/namespace/name.
  ObjectIdentity owner = 11;
}

message CreateResponse {
  string id = 1;       // Provider-specific VM identifier
  TaskRef task = 2;    // Optional task reference for async operations
}

// Delete a virtual machine
message DeleteRequest {
  string id = 1;

  // target_host_id names the host a clustered ("brain-in-operator") provider
  // must run this delete on (ADR-0007 Addendum A, A1): the operator's confirmed
  // binding (VirtualMachine status.placement.host), threaded on the wire exactly
  // like CreateRequest.target_host_id. AGNOSTIC. Additive and backward-compatible:
  // single-host and thin-client providers ignore it, and the operator never sends
  // it to them; a clustered provider REQUIRES it and rejects an empty value with
  // InvalidArgument rather than defaulting to some host (honesty-first, D9). The
  // provider never looks a VM's host up by itself (D1).
  string target_host_id = 2;

  // owner identifies the Kubernetes object (the VirtualMachine) this delete is
  // performed for: the same identity CreateRequest.owner stamps onto the VM it
  // creates (ADR-0007 Addendum A, A2). AGNOSTIC. Additive and backward-compatible:
  // single-host and thin-client providers ignore it (their Delete behavior is
  // unchanged, so a legacy unstamped VM stays deletable). A clustered provider
  // deletes a VM ONLY when its recorded owner uid equals this uid; a VM whose
  // stamp is missing or records a different owner is reported NOT_FOUND and is
  // NEVER destroyed, so a cleanup (e.g. a finalizer after an ALREADY_EXISTS
  // create) can never remove another tenant's VM. The operator sets it, from
  // vm.UID/namespace/name, on every delete that carries a target_host_id.
  ObjectIdentity owner = 3;
}

// Power control operations
message PowerRequest {
  string id = 1;
  PowerOp op = 2;
  int32 graceful_timeout_seconds = 3;  // Timeout for graceful operations (shutdown/reboot)

  // target_host_id names the host a clustered ("brain-in-operator") provider
  // must run this power operation on (ADR-0007 Addendum A, A1): the operator's confirmed
  // binding (VirtualMachine status.placement.host), threaded on the wire exactly
  // like CreateRequest.target_host_id. AGNOSTIC. Additive and backward-compatible:
  // single-host and thin-client providers ignore it, and the operator never sends
  // it to them; a clustered provider REQUIRES it and rejects an empty value with
  // InvalidArgument rather than defaulting to some host (honesty-first, D9). The
  // provider never looks a VM's host up by itself (D1).
  string target_host_id = 4;

  // owner identifies the Kubernetes object (the VirtualMachine) this power
  // operation is performed for — the identity CreateRequest.owner stamps onto
  // the VM (ADR-0007 Addendum A, slice 2). AGNOSTIC. Additive and
  // backward-compatible: single-host and thin-client providers ignore it, and
  // the operator sends it only with a target_host_id. A clustered provider
  // powers a VM ONLY when its recorded owner uid equals this uid; a VM whose
  // stamp is missing, unreadable or records a different owner is reported
  // NOT_FOUND and is never started, stopped or rebooted.
  ObjectIdentity owner = 5;
}

// Reconfigure virtual machine resources
message ReconfigureRequest {
  string id = 1;
  string desired_json = 2; // JSON-encoded desired state

  // target_host_id names the host a clustered ("brain-in-operator") provider
  // must run this reconfigure on (ADR-0007 Addendum A, A1): the operator's confirmed
  // binding (VirtualMachine status.placement.host), threaded on the wire exactly
  // like CreateRequest.target_host_id. AGNOSTIC. Additive and backward-compatible:
  // single-host and thin-client providers ignore it, and the operator never sends
  // it to them; a clustered provider REQUIRES it and rejects an empty value with
  // InvalidArgument rather than defaulting to some host (honesty-first, D9). The
  // provider never looks a VM's host up by itself (D1).
  string target_host_id = 3;

  // owner identifies the Kubernetes object (the VirtualMachine) this
  // reconfigure is performed for — the identity CreateRequest.owner stamps onto
  // the VM (ADR-0007 Addendum A, slice 2). AGNOSTIC. Additive and
  // backward-compatible: single-host and thin-client providers ignore it, and
  // the operator sends it only with a target_host_id. A clustered provider
  // reconfigures a VM ONLY when its recorded owner uid equals this uid; a VM
  // whose stamp is missing, unreadable or records a different owner is reported
  // NOT_FOUND and none of its CPU, memory or disks is changed.
  ObjectIdentity owner = 4;
}

// Upgrade VM hardware version
message HardwareUpgradeRequest {
  string id = 1;
  int32 target_version = 2; // Target hardware version (e.g., 21)

  // target_host_id names the host a clustered ("brain-in-operator") provider
  // must run this hardware upgrade on (ADR-0007 Addendum A, A1): the operator's confirmed
  // binding (VirtualMachine status.placement.host), threaded on the wire exactly
  // like CreateRequest.target_host_id. AGNOSTIC. Additive and backward-compatible:
  // single-host and thin-client providers ignore it, and the operator never sends
  // it to them; a clustered provider REQUIRES it and rejects an empty value with
  // InvalidArgument rather than defaulting to some host (honesty-first, D9). The
  // provider never looks a VM's host up by itself (D1).
  // HardwareUpgrade has no manager-side caller today; the field is reserved on
  // the wire so a later slice can route it without another proto change.
  string target_host_id = 3;
}

// Generic task response for async operations
message TaskResponse {
  TaskRef task = 1;
}

// Describe virtual machine current state
message DescribeRequest {
  string id = 1;

  // target_host_id names the host a clustered ("brain-in-operator") provider
  // must run this describe on (ADR-0007 Addendum A, A1): the operator's confirmed
  // binding (VirtualMachine status.placement.host), threaded on the wire exactly
  // like CreateRequest.target_host_id. AGNOSTIC. Additive and backward-compatible:
  // single-host and thin-client providers ignore it, and the operator never sends
  // it to them; a clustered provider REQUIRES it and rejects an empty value with
  // InvalidArgument rather than defaulting to some host (honesty-first, D9). The
  // provider never looks a VM's host up by itself (D1).
  string target_host_id = 2;

  // owner identifies the Kubernetes object (the VirtualMachine) this describe
  // is performed for — the identity CreateRequest.owner stamps onto the VM
  // (ADR-0007 Addendum A). AGNOSTIC. Additive and backward-compatible:
  // single-host and thin-client providers ignore it, and the operator sends it
  // only with a target_host_id. A clustered provider reports a VM whose stamp
  // is missing or records a different owner as exists=false and returns none of
  // its state, so a VirtualMachine can never read another tenant's VM that took
  // over the name on its host (the operator then applies its no-recreate rule).
  ObjectIdentity owner = 3;
}

message DescribeResponse {
  bool exists = 1;
  string power_state = 2;
  repeated string ips = 3;
  string console_url = 4;
  string provider_raw_json = 5; // Provider-specific additional data
}

// Check async task status
message TaskStatusRequest {
  TaskRef task = 1;
}

message TaskStatusResponse {
  bool done = 1;
  string error = 2; // Error message if task failed
}

// Snapshot operations
message SnapshotCreateRequest {
  string vm_id = 1;
  string name_hint = 2;
  bool include_memory = 3; // Include memory state if supported
  string description = 4;

  // target_host_id names the host a clustered ("brain-in-operator") provider
  // must run this snapshot create on (ADR-0007 Addendum A, A1): the operator's confirmed
  // binding (VirtualMachine status.placement.host), threaded on the wire exactly
  // like CreateRequest.target_host_id. AGNOSTIC. Additive and backward-compatible:
  // single-host and thin-client providers ignore it, and the operator never sends
  // it to them; a clustered provider REQUIRES it and rejects an empty value with
  // InvalidArgument rather than defaulting to some host (honesty-first, D9). The
  // provider never looks a VM's host up by itself (D1).
  string target_host_id = 5;
}

message SnapshotCreateResponse {
  string snapshot_id = 1;
  TaskRef task = 2;
}

message SnapshotDeleteRequest {
  string vm_id = 1;
  string snapshot_id = 2;

  // target_host_id names the host a clustered ("brain-in-operator") provider
  // must run this snapshot delete on (ADR-0007 Addendum A, A1): the operator's confirmed
  // binding (VirtualMachine status.placement.host), threaded on the wire exactly
  // like CreateRequest.target_host_id. AGNOSTIC. Additive and backward-compatible:
  // single-host and thin-client providers ignore it, and the operator never sends
  // it to them; a clustered provider REQUIRES it and rejects an empty value with
  // InvalidArgument rather than defaulting to some host (honesty-first, D9). The
  // provider never looks a VM's host up by itself (D1).
  string target_host_id = 3;
}

message SnapshotRevertRequest {
  string vm_id = 1;
  string snapshot_id = 2;

  // target_host_id names the host a clustered ("brain-in-operator") provider
  // must run this snapshot revert on (ADR-0007 Addendum A, A1): the operator's confirmed
  // binding (VirtualMachine status.placement.host), threaded on the wire exactly
  // like CreateRequest.target_host_id. AGNOSTIC. Additive and backward-compatible:
  // single-host and thin-client providers ignore it, and the operator never sends
  // it to them; a clustered provider REQUIRES it and rejects an empty value with
  // InvalidArgument rather than defaulting to some host (honesty-first, D9). The
  // provider never looks a VM's host up by itself (D1).
  string target_host_id = 3;
}

// Clone operations
message CloneRequest {
  string source_vm_id = 1;
  string target_name = 2;
  bool linked = 3; // Best-effort linked clone
  
  // JSON-encoded specifications for customization
  string class_json = 4;     // VMClass overrides
  string placement_json = 5; // Placement hints
  string customize_json = 6; // Customization spec

  // source_host_id names the host the SOURCE VM runs on for a clustered
  // ("brain-in-operator") provider (ADR-0007 Addendum A, A1): the source VM's
  // confirmed binding (status.placement.host). It is the routing field for the
  // clone. It is deliberately NOT target_host_id, which keeps the meaning the
  // main ADR gives it: the host where the clone lands. In v1 a clustered provider
  // requires the two to be equal (disks are host-local and a linked clone depends
  // on its source disk). AGNOSTIC. Additive and backward-compatible: single-host
  // and thin-client providers ignore it, and the operator never sends it to them;
  // a clustered provider REQUIRES it and rejects an empty value with
  // InvalidArgument rather than defaulting to some host.
  string source_host_id = 7;

  // target_vm names the Kubernetes VirtualMachine the clone will be bound to:
  // its namespace (VMClone spec.target.namespace, defaulted to the VMClone's
  // namespace) and its name (== target_name). uid is empty: the VirtualMachine
  // does not exist yet when the clone is made. A provider whose VM names are
  // host-global names the clone from it (the libvirt provider:
  // "<namespace>.<name>", the same rule as Create) and returns that name as
  // target_vm_id, which the operator records as the VM's status.id. Additive
  // and backward-compatible: other providers ignore it, and an unset value
  // keeps the legacy target_name naming.
  ObjectIdentity target_vm = 8;
}

message CloneResponse {
  string target_vm_id = 1;
  TaskRef task = 2;
}

// Image preparation operations
message ImagePrepareRequest {
  string image_json = 1; // JSON-encoded VMImage spec
  string target_name = 2; // Target template/image name
  string storage_hint = 3; // Storage location hint (datastore, pool, etc.)
}

// ImagePrepareResponse reports where the provider placed the prepared image so
// the manager can later create VMs from that prepared location instead of
// re-resolving (and possibly re-downloading) the original source (issue #154,
// PR-6 / #214).
//
// It mirrors the CloneResponse precedent: `task` stays at field 1 so this
// message is wire-compatible with the TaskResponse it replaces — a manager that
// still decodes a TaskResponse reads field 1 (the TaskRef) unchanged, and the
// new id/path fields are simply ignored by older decoders. The change is
// therefore additive and non-breaking.
message ImagePrepareResponse {
  // task references an async prepare operation; an empty/nil task means the
  // prepare completed synchronously. Field 1 is intentionally identical to
  // TaskResponse.task for wire compatibility.
  TaskRef task = 1;
  // prepared_image_id is the provider-specific identifier of the prepared image
  // — e.g. a vSphere template name / MoRef value, or a Proxmox template
  // name/VMID. The manager stamps this onto VMImage.status and uses it as the
  // template ref at create time. Known at trigger time even for async prepares.
  string prepared_image_id = 2;
  // prepared_image_path is the provider-specific path of the prepared image —
  // e.g. a libvirt pool path (<poolPath>/<target>.qcow2). Empty for providers
  // that address prepared images by id/name only (vSphere, Proxmox). Known at
  // trigger time even for async prepares.
  string prepared_image_path = 3;
}

// Disk export/import host-vs-pod execution contract (ADR-0006).
//
// Disk bytes NEVER traverse this gRPC channel. ExportDisk/ImportDisk move bytes
// between the hypervisor host and the staging backend out-of-band; the RPC only
// orchestrates and returns identifiers/checksums.
//
// transfer_mode selects who touches the bytes:
//   - "relay":  host -> provider-pod -> backend (today's pod-side path; the
//               provider pod stages bytes through a mounted PVC).
//   - "direct": host -> backend (the provider streams straight to the backend,
//               e.g. S3, with no provider-pod hop).
//   - "auto":   the manager/provider pick relay or direct from what both sides
//               advertise in GetCapabilities.
//
// backend_type names the staging backend ("pvc" | "nfs" | "s3"); an empty value
// means the legacy pvc path for wire compatibility with pre-ADR-0006 callers.

// Disk export operations for migration
message ExportDiskRequest {
  string vm_id = 1;            // VM identifier
  string disk_id = 2;          // Disk identifier (optional, defaults to primary disk)
  string snapshot_id = 3;      // Snapshot to export from (optional)
  string destination_url = 4;  // Where to upload the disk (S3, HTTP, etc.)
  string format = 5;           // Desired export format (qcow2, vmdk, raw)
  bool compress = 6;           // Enable compression during export
  map<string, string> credentials = 7; // Credentials for destination (access keys, tokens)
  string backend_type = 8;     // Staging backend: "pvc" | "nfs" | "s3"; empty == legacy pvc (ADR-0006)
  string transfer_mode = 9;    // Transfer mode: "auto" | "relay" | "direct" (ADR-0006)
  string storage_options_json = 10; // JSON-encoded backend-specific options (ADR-0006; empty in Slice 0)

  // target_host_id names the host a clustered ("brain-in-operator") provider
  // must run this disk export on (ADR-0007 Addendum A, A1): the operator's confirmed
  // binding (VirtualMachine status.placement.host), threaded on the wire exactly
  // like CreateRequest.target_host_id. AGNOSTIC. Additive and backward-compatible:
  // single-host and thin-client providers ignore it, and the operator never sends
  // it to them; a clustered provider REQUIRES it and rejects an empty value with
  // InvalidArgument rather than defaulting to some host (honesty-first, D9). The
  // provider never looks a VM's host up by itself (D1).
  string target_host_id = 11;
}

message ExportDiskResponse {
  string export_id = 1;        // Export operation identifier
  TaskRef task = 2;            // Task reference for async tracking
  int64 estimated_size_bytes = 3; // Estimated size of export
  string checksum = 4;         // Checksum of exported disk (SHA256)
}

// Disk import operations for migration.
// See the ExportDiskRequest host-vs-pod execution contract above: disk bytes
// never traverse the gRPC channel; backend_type/transfer_mode carry the same
// meaning for the import (target) side (ADR-0006).
message ImportDiskRequest {
  string source_url = 1;       // Where to download the disk from (S3, HTTP, etc.)
  string storage_hint = 2;     // Target storage location (datastore, pool, etc.)
  string format = 3;           // Source disk format (qcow2, vmdk, raw)
  string target_name = 4;      // Name for the imported disk
  bool verify_checksum = 5;    // Verify checksum after import
  string expected_checksum = 6; // Expected checksum (SHA256)
  map<string, string> credentials = 7; // Credentials for source (access keys, tokens)
  string backend_type = 8;     // Staging backend: "pvc" | "nfs" | "s3"; empty == legacy pvc (ADR-0006)
  string transfer_mode = 9;    // Transfer mode: "auto" | "relay" | "direct" (ADR-0006)
  string storage_options_json = 10; // JSON-encoded backend-specific options (ADR-0006; empty in Slice 0)

  // target_vm names the Kubernetes VirtualMachine the disk is imported for (a
  // VMMigration's target): its namespace and name; uid is empty, as the
  // VirtualMachine does not exist yet. A provider that attaches an imported
  // disk in place only when it carries the VM's own name derives the landing
  // name from it with the same rule its Create uses (the libvirt provider:
  // "<namespace>.<name>-migrated"), so the naming rule has one owner, the
  // provider. The landing path is returned in path, which the operator hands
  // back to the VM unchanged. Additive and backward-compatible: other providers
  // ignore it, and an unset value keeps the legacy target_name naming.
  ObjectIdentity target_vm = 11;
}

message ImportDiskResponse {
  string disk_id = 1;          // Imported disk identifier
  string path = 2;             // Path to imported disk
  TaskRef task = 3;            // Task reference for async tracking
  int64 actual_size_bytes = 4; // Actual size of imported disk
  string checksum = 5;         // Checksum of imported disk (SHA256)
}

// Get disk information for migration planning
message GetDiskInfoRequest {
  string vm_id = 1;            // VM identifier
  string disk_id = 2;          // Disk identifier (optional, defaults to primary disk)
  string snapshot_id = 3;      // Get info for specific snapshot (optional)

  // target_host_id names the host a clustered ("brain-in-operator") provider
  // must run this disk-info read on (ADR-0007 Addendum A, A1): the operator's confirmed
  // binding (VirtualMachine status.placement.host), threaded on the wire exactly
  // like CreateRequest.target_host_id. AGNOSTIC. Additive and backward-compatible:
  // single-host and thin-client providers ignore it, and the operator never sends
  // it to them; a clustered provider REQUIRES it and rejects an empty value with
  // InvalidArgument rather than defaulting to some host (honesty-first, D9). The
  // provider never looks a VM's host up by itself (D1).
  string target_host_id = 4;
}

message GetDiskInfoResponse {
  string disk_id = 1;          // Disk identifier
  string format = 2;           // Disk format (qcow2, vmdk, raw)
  int64 virtual_size_bytes = 3; // Virtual size (capacity)
  int64 actual_size_bytes = 4;  // Actual size (allocated)
  string path = 5;             // Path or location
  bool is_bootable = 6;        // Is this a boot disk
  repeated string snapshots = 7; // Available snapshots
  string backing_file = 8;     // Backing file (for linked clones)
  map<string, string> metadata = 9; // Additional provider-specific metadata
}

// List all VMs managed by this provider
message ListVMsRequest {}

message ListVMsResponse {
  repeated VMInfo vms = 1;
}

message VMInfo {
  string id = 1;                // Provider-specific VM identifier
  string name = 2;              // VM name
  string power_state = 3;       // Current power state
  repeated string ips = 4;      // IP addresses
  int32 cpu = 5;                // Number of virtual CPUs
  int64 memory_mib = 6;         // Memory in MiB
  repeated DiskInfo disks = 7;  // Disk information
  repeated NetworkInfo networks = 8; // Network information
  map<string, string> provider_raw = 9; // Provider-specific metadata
}

message DiskInfo {
  string id = 1;        // Disk identifier
  string path = 2;      // Disk path
  int32 size_gib = 3;   // Disk size in GiB
  string format = 4;    // Disk format (qcow2, vmdk, raw, etc.)
}

message NetworkInfo {
  string name = 1;        // Network name
  string mac = 2;         // MAC address
  string ip_address = 3;  // IP address if static
}

// --- Host inventory (ADR-0007 P1, D1/D3) ------------------------------------
// Host inventory lets a clustered ("brain-in-operator") provider report the
// hosts it fronts so the operator can schedule VMs across them. Single-host and
// thin-client providers do not implement these RPCs: they return
// codes.Unimplemented and advertise supports_clustering = false (D7,
// honesty-first). No VM or disk bytes traverse these calls — they return host
// inventory metadata only.

// List every host a clustered provider fronts
message ListHostsRequest {}

message ListHostsResponse {
  repeated HostInfo hosts = 1;
}

// HostInfo describes one hypervisor host in a clustered provider's inventory.
// The shape is hypervisor-AGNOSTIC; the SOURCE of each value is per-hypervisor
// (e.g. libvirt reads `virsh nodeinfo` / `pool-info` / `domcapabilities`). See
// ADR-0007 for the full agnostic-vs-per-hypervisor breakdown.
message HostInfo {
  string id = 1;                       // Operator-assigned host id (== Host CR name). AGNOSTIC.
  string address = 2;                  // SSH endpoint / agent address. AGNOSTIC.
  int32 allocatable_cpu = 3;           // Allocatable vCPUs. AGNOSTIC shape; per-HV source.
  int64 allocatable_mem_mib = 4;       // Allocatable memory in MiB. AGNOSTIC shape; per-HV source.
  int64 allocatable_storage = 5;       // Allocatable storage in bytes. Per-HV (per-pool vs host-fs).
  HostHealth health = 6;               // Health probe result. AGNOSTIC enum; per-HV probe.
  map<string, string> labels = 7;      // Scheduling constraints (storage-pool/network visibility, zone/rack). AGNOSTIC.
  string cpu_model = 8;                // Baseline CPU model. Per-HV interpretation.
  repeated string cpu_features = 9;    // CPU feature flags. Per-HV.
  repeated string machine_types = 10;  // Supported machine types. Per-HV.
  string emulator_version = 11;        // Emulator/hypervisor version. Per-HV.
}

// HostHealth is the AGNOSTIC health enum for a host; the probe that produces it
// is per-hypervisor (e.g. libvirtd reachability).
enum HostHealth {
  HOST_HEALTH_UNSPECIFIED = 0;
  HOST_HEALTH_READY = 1;
  HOST_HEALTH_NOT_READY = 2;
}

// Refresh a single host's inventory — cheaper than a full ListHosts poll when
// reconciling one Host CR. Returns a HostInfo.
message GetHostInfoRequest {
  string host_id = 1;
}

// Capability check - what features does this provider support
message GetCapabilitiesRequest {}

message GetCapabilitiesResponse {
  bool supports_reconfigure_online = 1;
  bool supports_disk_expansion_online = 2;
  bool supports_snapshots = 3;
  bool supports_memory_snapshots = 4;
  bool supports_linked_clones = 5;
  bool supports_image_import = 6;
  repeated string supported_disk_types = 7;
  repeated string supported_network_types = 8;
  bool supports_disk_export = 9;           // Can export disks for migration
  bool supports_disk_import = 10;          // Can import disks from external sources
  repeated string supported_export_formats = 11; // Supported export formats (qcow2, vmdk, raw)
  repeated string supported_import_formats = 12; // Supported import formats
  bool supports_export_compression = 13;   // Supports compression during export
  repeated string supported_export_backends = 14; // Export staging backends: "pvc"|"nfs"|"s3" (ADR-0006; empty == pvc-only)
  repeated string supported_import_backends = 15; // Import staging backends: "pvc"|"nfs"|"s3" (ADR-0006; empty == pvc-only)
  repeated string supported_transfer_modes = 16;  // Transfer modes: "relay"|"direct" (ADR-0006; empty == relay-only)
  bool supports_clustering = 17;                   // Provider fronts multiple hosts and implements host inventory (ListHosts/GetHostInfo) + host-targeted placement (ADR-0007 P1, D7). The remaining clustering flags (live/block migration, host evacuation, storage modes) are added by the migration slice.
}

// ObjectIdentity names a Kubernetes object on the wire (CreateRequest.owner,
// DeleteRequest.owner, DescribeRequest.owner, CloneRequest.target_vm,
// ImportDiskRequest.target_vm).
// uid is the authoritative identity (unique for the object's whole lifetime,
// never reused after deletion); namespace and name are informational (audit,
// operator diagnostics, and naming the hypervisor-side object — e.g. the
// libvirt provider names a new domain "<namespace>.<name>") and must never be
// used for authorization on their own.
message ObjectIdentity {
  string uid = 1;
  string namespace = 2;
  string name = 3;
}

// Provider service definition
service Provider {
  // Validate provider configuration and connectivity
  rpc Validate(ValidateRequest) returns (ValidateResponse);
  
  // Create a new virtual machine
  rpc Create(CreateRequest) returns (CreateResponse);
  
  // Delete a virtual machine
  rpc Delete(DeleteRequest) returns (TaskResponse);
  
  // Perform power operations on a virtual machine
  rpc Power(PowerRequest) returns (TaskResponse);
  
  // Reconfigure virtual machine resources
  rpc Reconfigure(ReconfigureRequest) returns (TaskResponse);
  
  // Upgrade VM hardware version
  rpc HardwareUpgrade(HardwareUpgradeRequest) returns (TaskResponse);
  
  // Describe current virtual machine state
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  
  // Check the status of an async task
  rpc TaskStatus(TaskStatusRequest) returns (TaskStatusResponse);
  
  // Snapshot operations
  rpc SnapshotCreate(SnapshotCreateRequest) returns (SnapshotCreateResponse);
  rpc SnapshotDelete(SnapshotDeleteRequest) returns (TaskResponse);
  rpc SnapshotRevert(SnapshotRevertRequest) returns (TaskResponse);
  
  // Clone operations
  rpc Clone(CloneRequest) returns (CloneResponse);
  
  // Image preparation and import. Returns the prepared image's provider-specific
  // location (id/path) so the manager can later create VMs from the prepared
  // template instead of re-resolving the original source. ImagePrepareResponse
  // is wire-compatible with the TaskResponse this previously returned (task at
  // field 1), so the change is non-breaking (issue #154, PR-6 / #214).
  rpc ImagePrepare(ImagePrepareRequest) returns (ImagePrepareResponse);
  
  // Get provider capabilities
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
  
  // Disk migration operations
  rpc ExportDisk(ExportDiskRequest) returns (ExportDiskResponse);
  rpc ImportDisk(ImportDiskRequest) returns (ImportDiskResponse);
  rpc GetDiskInfo(GetDiskInfoRequest) returns (GetDiskInfoResponse);
  
  // List all VMs managed by this provider
  rpc ListVMs(ListVMsRequest) returns (ListVMsResponse);

  // Host inventory (ADR-0007 P1). Clustered providers report the hosts they
  // front so the operator can schedule across them; single-host and thin-client
  // providers return codes.Unimplemented and advertise supports_clustering =
  // false. GetHostInfo is the cheaper single-host refresh.
  rpc ListHosts(ListHostsRequest) returns (ListHostsResponse);
  rpc GetHostInfo(GetHostInfoRequest) returns (HostInfo);
}
