version: v1
name: buf.build/projectbeskar/virtrigaud
deps:
  - buf.build/googleapis/googleapis
breaking:
  # FILE is the strictest category: it also flags changes that are wire
  # compatible but break generated code (a moved message, a renamed package).
  # Nothing is excepted: the rules this file used to except (FIELD_NO_DELETE,
  # FIELD_SAME_TYPE, RPC_NO_DELETE, ENUM_VALUE_NO_DELETE, ...) are the ones
  # that catch a deleted or retyped field, a removed RPC and a removed enum
  # value. Adding fields, enum values, messages and RPCs is never reported.
  # The name FIELD_SAME_DEFAULT that was excepted here does not exist in buf v1.
  use:
    - FILE
lint:
  use:
    - STANDARD
  except:
    # Allow flexibility in field naming for compatibility
    - FIELD_LOWER_SNAKE_CASE
    # Allow flexibility in enum value naming  
    - ENUM_VALUE_UPPER_SNAKE_CASE
    # Allow flexibility in service naming for existing APIs
    - SERVICE_SUFFIX
    # Allow reusing response types for consistency
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
  ignore:
    # Ignore generated files
    - "**/*_grpc.pb.go"
    - "**/*.pb.go"
