syntax = "proto3";

// Package agent.v1 is the service a per-host agent offers to the Provider
// that routes to it. It is internal to VirtRigaud: it is not part of the
// provider contract, and external Provider implementations neither serve nor
// call it. Changes to it are additive, like every message in this module.
package agent.v1;

import "provider/v1/host_answer.proto";

option go_package = "github.com/projectbeskar/virtrigaud/proto/rpc/agent/v1;agentv1";

// AgentService is served by a per-host agent, next to the provider.v1
// Provider methods it serves for its host, and called only by the Provider
// that routes to the host, over the mutually authenticated connection that
// Provider holds to the agent. Every answer carries a host-signed HostAnswer
// that echoes the caller's answer_nonce.
service AgentService {
  // Hello is the first call on each connection: the caller states its own
  // API version and learns the agent's (HostAnswer.agent_api_version).
  rpc Hello(HelloRequest) returns (HelloResponse);
  // InstallRenewedCertificate stages, or puts in use, a renewed identity
  // certificate for the new key the host generated for its renewal. It
  // needs no grant: the agent accepts only a certificate that chains to the
  // identity issuer it pinned at enrolment, certifies exactly the identities
  // of its current certificate, and certifies the key of the renewal it
  // requested itself.
  rpc InstallRenewedCertificate(InstallRenewedCertificateRequest) returns (InstallRenewedCertificateResponse);
  // AgentStatus reports the agent's state. It is a plain read, except that
  // it may carry the manager's confirmation that the host may discard the
  // records of frozen predecessor enrolments (confirm_frozen_enrolment_ids).
  rpc AgentStatus(AgentStatusRequest) returns (AgentStatusResponse);
}

// HelloRequest opens a connection.
message HelloRequest {
  // answer_nonce is exactly 16 random bytes, fresh for each request,
  // echoed in the HostAnswer.
  bytes answer_nonce = 1;
  // caller_api_version is the caller's version of this service, from 1.
  uint32 caller_api_version = 2;
}

// HelloResponse answers Hello.
message HelloResponse {
  // host_answer is a SignedBlob of a HostAnswer.
  provider.v1.SignedBlob host_answer = 1;
}

// InstallRenewedCertificateRequest carries a renewed certificate.
message InstallRenewedCertificateRequest {
  // answer_nonce is exactly 16 random bytes, fresh for each request,
  // echoed in the HostAnswer.
  bytes answer_nonce = 1;
  // certificate is the DER-encoded renewed certificate.
  bytes certificate = 2;
  // activate puts the staged certificate in use. When false, the agent
  // validates certificate and stages it. When true, certificate must equal
  // the staged certificate byte for byte, and the agent uses it, and its
  // key, from then on; the answer is signed with the new key.
  bool activate = 3;
}

// InstallRenewedCertificateResponse answers InstallRenewedCertificate.
message InstallRenewedCertificateResponse {
  // host_answer is a SignedBlob of a HostAnswer; its
  // staged_certificate_sha256 names the staged certificate, or is empty
  // once the certificate is in use.
  provider.v1.SignedBlob host_answer = 1;
}

// AgentStatusRequest asks for the agent's state.
message AgentStatusRequest {
  // answer_nonce is exactly 16 random bytes, fresh for each request,
  // echoed in the HostAnswer.
  bytes answer_nonce = 1;
  // confirm_frozen_enrolment_ids are 16-byte enrolment ids of frozen
  // predecessor enrolments whose freeze the manager confirms: it holds no
  // open operation under them, and the host may discard their records.
  // Unsigned: the Provider relays it from the host inventory. The agent
  // acts only on ids it holds as frozen predecessors of
  // confirm_for_enrolment_id when that is its active enrolment, and ignores
  // the rest. A confirmation that is false costs only liveness (the
  // discarded operations are answered UNKNOWN_TO_AGENT), never a second
  // execution. At most 16 ids. An agent that does not know the field
  // ignores it.
  repeated bytes confirm_frozen_enrolment_ids = 2;
  // confirm_for_enrolment_id is the enrolment the confirmation was made for:
  // the host's current enrolment as the manager knows it.
  bytes confirm_for_enrolment_id = 3;
}

// AgentStatusResponse answers AgentStatus.
message AgentStatusResponse {
  // host_answer is a SignedBlob of a HostAnswer.
  provider.v1.SignedBlob host_answer = 1;
  // freeze_results answers the request's confirm_frozen_enrolment_ids: one
  // result for each id, in the order of the request. It is empty when the
  // request carried no confirmation, when it named more ids than the agent
  // takes, and from an agent that applies no confirmation (a release build,
  // or one that predates this field). It is not signed: only the Provider
  // reads it, from the mutually authenticated connection the request went
  // on, to decide whether to relay the confirmation again; the manager acts
  // only on its own signed reads. A caller treats a missing, short or
  // mismatched list, and any outcome it does not know, as not applied and
  // relays the confirmation again later (applying it again is a no-op).
  repeated FreezeConfirmationResult freeze_results = 2;
}

// FreezeConfirmationResult is the agent's outcome for one enrolment id of a
// freeze confirmation.
message FreezeConfirmationResult {
  // enrolment_id echoes the confirmed enrolment id it answers.
  bytes enrolment_id = 1;
  // outcome is what the agent did with it.
  FreezeConfirmationOutcome outcome = 2;
}

// FreezeConfirmationOutcome is what an agent did with one confirmed
// enrolment id. ACCEPTED, ALREADY_APPLIED and NOT_APPLICABLE settle the
// confirmation for that id; every other value asks for it to be relayed
// again later.
enum FreezeConfirmationOutcome {
  // FREEZE_CONFIRMATION_OUTCOME_UNSPECIFIED is never sent; read as not
  // applied.
  FREEZE_CONFIRMATION_OUTCOME_UNSPECIFIED = 0;
  // FREEZE_CONFIRMATION_OUTCOME_ACCEPTED: this request retired the frozen
  // predecessor, durably; its remaining records are removed in chunks.
  FREEZE_CONFIRMATION_OUTCOME_ACCEPTED = 1;
  // FREEZE_CONFIRMATION_OUTCOME_ALREADY_APPLIED: the predecessor was retired
  // before (its records are being removed, or are gone); nothing changed.
  FREEZE_CONFIRMATION_OUTCOME_ALREADY_APPLIED = 2;
  // FREEZE_CONFIRMATION_OUTCOME_REFUSED_OVER_CAPACITY: the agent already
  // removes as many retired predecessors as it takes at once; the
  // predecessor stays frozen and nothing changed. Relay it again later.
  FREEZE_CONFIRMATION_OUTCOME_REFUSED_OVER_CAPACITY = 3;
  // FREEZE_CONFIRMATION_OUTCOME_NOT_APPLICABLE: the id is not a frozen
  // predecessor the agent holds or retired (unknown, malformed, repeated in
  // the request, or the active enrolment itself); relaying the same
  // confirmation again changes nothing.
  FREEZE_CONFIRMATION_OUTCOME_NOT_APPLICABLE = 4;
  // FREEZE_CONFIRMATION_OUTCOME_DEFERRED: not applied now, for a reason
  // that can pass (the agent is not ready, the confirmation was made for an
  // enrolment that is not the active one, a freeze is in progress, the
  // store could not be written in time); nothing changed. Relay it again
  // later.
  FREEZE_CONFIRMATION_OUTCOME_DEFERRED = 5;
}
