# VirtRigaud Provider Catalog
# This file lists all verified and community providers for VirtRigaud
#
# Reading this file:
# - `tag` is the VirtRigaud release the in-tree provider ships in.
# - `capabilities` lists the capability profiles (core, snapshot, clone,
#   image-prepare, advanced) the provider serves, from the flags in its
#   GetCapabilities (sdk/provider/capabilities). The Proxmox provider sets the
#   image-import flag only so that ImagePrepare can refuse an import-style
#   image with a clear reason, so image-prepare is not listed for it. It is a
#   statement about the provider, not about a test run.
# - `conformance` records "skip" (not run) for every profile and carries no
#   report or date: the conformance suite (`vcts run`) is not run against these
#   providers by CI, which only validates the specs (`vcts validate`). A profile
#   is only recorded as "pass" once a conformance run backs it.

metadata:
  version: "v1"
  lastUpdated: "2026-10-25T12:01:00Z"
  description: "Official catalog of VirtRigaud providers"

providers:
  # Official mock provider for testing and development
  - name: mock
    displayName: "Mock Provider"
    description: "A mock provider for testing and demonstrations. The release workflow does not publish an image for it: build it from cmd/provider-mock/Dockerfile."
    repo: "https://github.com/projectbeskar/virtrigaud"
    image: ""
    tag: ""
    capabilities:
      - core
      - snapshot
      - clone
      - image-prepare
      - advanced
    conformance:
      profiles:
        core: skip
        snapshot: skip
        clone: skip
        image-prepare: skip
        advanced: skip
      report_url: ""
      badge_url: "https://img.shields.io/badge/conformance-not%20run-lightgrey"
      last_tested: ""
    maintainer: "virtrigaud@projectbeskar.com"
    license: "Apache-2.0"
    maturity: "stable"
    tags:
      - testing
      - development
      - demo
    documentation: "https://github.com/projectbeskar/virtrigaud/tree/main/internal/providers/mock"

  # Official Proxmox VE provider
  - name: proxmox
    displayName: "Proxmox VE Provider"
    description: "Proxmox Virtual Environment provider for VirtRigaud. ImagePrepare refuses import-style (source.http) images, so the image-prepare profile is not listed."
    repo: "https://github.com/projectbeskar/virtrigaud"
    image: "ghcr.io/projectbeskar/virtrigaud/provider-proxmox"
    tag: "v0.4.2"
    capabilities:
      - core
      - snapshot
      - clone
      - advanced
    conformance:
      profiles:
        core: skip
        snapshot: skip
        clone: skip
        advanced: skip
      report_url: ""
      badge_url: "https://img.shields.io/badge/conformance-not%20run-lightgrey"
      last_tested: ""
    maintainer: "virtrigaud@projectbeskar.com"
    license: "Apache-2.0"
    maturity: "beta"
    tags:
      - hypervisor
      - proxmox
      - kvm
      - containers
    documentation: "https://projectbeskar.github.io/virtrigaud/providers/proxmox/"

  # Official vSphere provider
  - name: vsphere
    displayName: "vSphere Provider"
    description: "VMware vSphere provider for VirtRigaud"
    repo: "https://github.com/projectbeskar/virtrigaud"
    image: "ghcr.io/projectbeskar/virtrigaud/provider-vsphere"
    tag: "v0.4.2"
    capabilities:
      - core
      - snapshot
      - clone
      - image-prepare
      - advanced
    conformance:
      profiles:
        core: skip
        snapshot: skip
        clone: skip
        image-prepare: skip
        advanced: skip
      report_url: ""
      badge_url: "https://img.shields.io/badge/conformance-not%20run-lightgrey"
      last_tested: ""
    maintainer: "virtrigaud@projectbeskar.com"
    license: "Apache-2.0"
    maturity: "beta"
    tags:
      - vmware
      - vsphere
      - enterprise
    documentation: "https://projectbeskar.github.io/virtrigaud/providers/vsphere/"

  # Official libvirt provider
  - name: libvirt
    displayName: "Libvirt Provider"
    description: "Libvirt/KVM provider for VirtRigaud. Clone makes full copies; linked clones are not supported, so the clone profile is not listed. The image-prepare profile is for a single-host Provider; a clustered libvirt Provider does not advertise it."
    repo: "https://github.com/projectbeskar/virtrigaud"
    image: "ghcr.io/projectbeskar/virtrigaud/provider-libvirt"
    tag: "v0.4.2"
    capabilities:
      - core
      - snapshot
      - image-prepare
      - advanced
    conformance:
      profiles:
        core: skip
        snapshot: skip
        image-prepare: skip
        advanced: skip
      report_url: ""
      badge_url: "https://img.shields.io/badge/conformance-not%20run-lightgrey"
      last_tested: ""
    maintainer: "virtrigaud@projectbeskar.com"
    license: "Apache-2.0"
    maturity: "beta"
    tags:
      - libvirt
      - kvm
      - qemu
      - open-source
    documentation: "https://projectbeskar.github.io/virtrigaud/providers/libvirt/"

# Schema information
schema:
  version: "v1"
  fields:
    provider:
      name:
        required: true
        type: string
        description: "Unique provider identifier"
      displayName:
        required: true
        type: string
        description: "Human-readable provider name"
      description:
        required: true
        type: string
        description: "Brief description of the provider"
      repo:
        required: true
        type: string
        format: url
        description: "Source code repository URL"
      image:
        required: true
        type: string
        description: "Container image repository (empty when the release does not publish an image)"
      tag:
        required: true
        type: string
        description: "Container image tag (empty when the release does not publish an image)"
      capabilities:
        required: true
        type: array
        items:
          enum: [core, snapshot, clone, image-prepare, advanced]
        description: "List of supported capability profiles"
      conformance:
        required: true
        type: object
        description: "Conformance test results; a profile is \"pass\" only when a conformance run backs it, \"skip\" means not run"
      maintainer:
        required: true
        type: string
        format: email
        description: "Maintainer email address"
      license:
        required: true
        type: string
        description: "License identifier (SPDX format)"
      maturity:
        required: true
        type: string
        enum: [alpha, beta, stable, deprecated]
        description: "Maturity level of the provider"
      tags:
        required: false
        type: array
        items:
          type: string
        description: "Descriptive tags for categorization"
      documentation:
        required: false
        type: string
        format: url
        description: "Link to provider documentation"
